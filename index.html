<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방 사진 검색</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F4;--surface:#FFFFFF;--ink:#17201D;--muted:#5B6964;--line:#D8DFDC;--accent:#2C6A56;--accent-ink:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1412;--surface:#172019;--ink:#E5ECE8;--muted:#9AA9A3;--line:#2A3631;--accent:#7FC4A8;--accent-ink:#0F1412}}
:root[data-theme="dark"]{--bg:#0F1412;--surface:#172019;--ink:#E5ECE8;--muted:#9AA9A3;--line:#2A3631;--accent:#7FC4A8;--accent-ink:#0F1412}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;line-height:1.55}
main{width:min(460px,100%)}
h1{font-size:22px;margin:0 0 6px}
p{margin:0 0 20px;color:var(--muted);font-size:14px}
a{display:block;padding:16px 18px;margin-bottom:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none}
a b{display:block;font-size:16px}
a span{font-size:13px;color:var(--muted)}
a:hover,a:focus-visible{border-color:var(--accent);outline:none}
a.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
a.primary span{color:inherit;opacity:.85}
</style>
</head>
<body>
<main>
  <h1>방 사진 검색</h1>
  <p>같은 PC, 같은 브라우저에서 두 화면을 각각 열어 쓰세요. 기록은 두 화면이 함께 씁니다.</p>
  <a class="primary" href="search_system.html?view=search" target="_blank" rel="noopener"><b>검색 화면</b><span>참여자용 · 진행자와 참여자 ID를 넣고 시작합니다</span></a>
  <a href="search_system.html?view=researcher" target="_blank" rel="noopener"><b>연구자 화면</b><span>사진 풀 관리 · 참여자 기록 · CSV 내보내기</span></a>
</main>
</body>
</html>
