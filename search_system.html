<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>검색</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: researcher pool manager = grid + sticky editor; participant view = search column + saved tray. Researcher screens carry an amber strip. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --sunk:#E9EDEB; --ink:#17201D; --muted:#5B6964; --line:#D8DFDC;
  --accent:#2C6A56; --accent-ink:#FFFFFF; --accent-soft:#E0EDE7;
  --research:#7A4C0C; --research-soft:#FBEFD9; --danger:#B3261E; --danger-soft:#FBE4E2;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#172019; --sunk:#111915; --ink:#E5ECE8; --muted:#9AA9A3; --line:#2A3631;
  --accent:#78C2A6; --accent-ink:#0E1512; --accent-soft:#1D3229;
  --research:#F1C47E; --research-soft:#2D2313; --danger:#F28A82; --danger-soft:#3A1D1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#172019; --sunk:#111915; --ink:#E5ECE8; --muted:#9AA9A3; --line:#2A3631;
  --accent:#78C2A6; --accent-ink:#0E1512; --accent-soft:#1D3229;
  --research:#F1C47E; --research-soft:#2D2313; --danger:#F28A82; --danger-soft:#3A1D1B; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3} h1{font-size:24px} h2{font-size:18px;font-weight:600} h3{font-size:15px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto}
.narrow{max-width:720px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px;justify-content:space-between;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{font-weight:600}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:999px;background:var(--sunk)}
.timer.low{background:var(--danger-soft);color:var(--danger)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.research-strip{display:flex;align-items:center;gap:8px;background:var(--research-soft);color:var(--research);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600}
.research-strip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--research)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.stats{display:flex;gap:20px;flex-wrap:wrap;font-size:14px}
.stats b{font-family:var(--f-mono);font-size:18px;display:block}
/* pool manager */
.manager{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.manager.solo{grid-template-columns:1fr}
@media (max-width:900px){.manager{grid-template-columns:1fr}}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pitem{position:relative;border:2px solid transparent;border-radius:10px;overflow:hidden;background:var(--surface);cursor:pointer;padding:0;text-align:left}
.pitem[aria-pressed=true]{border-color:var(--accent)}
.pitem img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--sunk)}
.pitem .meta{padding:6px 8px;font-size:12px;color:var(--muted);line-height:1.35;min-height:38px;word-break:break-all}
.pitem .flag{position:absolute;left:6px;top:6px;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px}
.flag.ex{background:var(--danger);color:#fff}
.flag.none{background:var(--research);color:#fff}
.editor{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 24px);overflow:auto}
.taggroup{display:flex;flex-direction:column;gap:6px}
.taggroup>span{font-size:12px;color:var(--muted);font-weight:600}
.tagbtns{display:flex;flex-wrap:wrap;gap:6px}
.tagbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.tagbtn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tagbtn[aria-pressed=mixed]{background:var(--accent-soft);border-color:var(--accent)}
.tagbtn.target[aria-pressed=true]{background:var(--danger);border-color:var(--danger);color:#fff}
.tagbtn.target[aria-pressed=mixed]{background:var(--danger-soft);border-color:var(--danger)}
.chk{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px;cursor:pointer}
.chk input{accent-color:var(--accent)}
/* participant */
.task{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
@media (max-width:860px){.task{grid-template-columns:1fr}}
.tray{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.tray-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.thumb{position:relative;border-radius:8px;overflow:hidden;background:var(--sunk);aspect-ratio:3/2}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb .x{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;padding:0;line-height:22px}
.progress{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.searchbar{display:flex;gap:8px}
.searchbar input{font-size:16px;padding:12px 16px;border-radius:999px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.result{border:0;padding:0;background:var(--sunk);border-radius:8px;overflow:hidden;cursor:zoom-in;aspect-ratio:3/2;position:relative}
.result img{width:100%;height:100%;object-fit:cover;display:block}
.result .saved-badge{position:absolute;left:6px;top:6px;background:var(--accent);color:var(--accent-ink);font-size:12px;border-radius:999px;padding:1px 8px}
.banner{padding:12px 16px;border-radius:8px;background:var(--danger-soft);color:var(--danger);font-weight:500}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(10,14,12,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .panel{background:var(--surface);border-radius:12px;max-width:1000px;width:100%;max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.modal .panel>img{width:100%;border-radius:8px;display:block}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pick{border:2px solid transparent;border-radius:10px;padding:0;background:none;cursor:pointer;overflow:hidden}
.pick[aria-pressed=true]{border-color:var(--accent)}
.pick img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);white-space:nowrap}
td.num{text-align:right;font-family:var(--f-mono)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px} .kv dt{color:var(--muted)} .kv dd{margin:0}
.pool-loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--muted);z-index:80;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:70;font-size:14px}
#rx-toggle{position:fixed;right:8px;bottom:8px;width:14px;height:14px;border-radius:50%;border:0;background:var(--line);opacity:.5;cursor:pointer;z-index:60}
#rx-panel{position:fixed;right:12px;bottom:32px;width:min(320px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--research);border-radius:12px;padding:14px;z-index:61;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.prog-bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}.prog-bar i{display:block;height:100%;background:var(--accent)}

/* participant: search-engine look */
body.search-mode .topbar{display:none}
.g-home{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-top:40px}
.g-logo{font-size:44px;font-weight:700;letter-spacing:-.03em;color:var(--ink);background:none;border:0;cursor:default;padding:0}
.g-logo.sm{font-size:22px;cursor:pointer;white-space:nowrap}
.g-form{display:flex;align-items:center;width:min(640px,100%);border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:4px 4px 4px 20px;box-shadow:0 1px 6px rgba(32,40,36,.08)}
.g-form:focus-within{box-shadow:0 2px 10px rgba(32,40,36,.16)}
.g-form input{flex:1;min-width:0;border:0;background:none;font-size:17px;padding:10px 0;outline:none}
.g-btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:9px 20px;cursor:pointer;font-weight:600;white-space:nowrap}
.g-top{display:flex;align-items:center;gap:20px;padding-block:18px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.g-top .g-form{width:min(640px,100%)}
.g-grid{display:flex;flex-wrap:wrap;gap:8px}
.g-item{height:190px;flex:1 1 250px;border:0;padding:0;border-radius:8px;overflow:hidden;background:var(--sunk);cursor:pointer;max-width:100%}
.g-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.g-item:hover img{transform:scale(1.03)}
.g-fill{flex:10 1 0;height:0}
@media (max-width:520px){.g-item{height:130px}.g-logo{font-size:34px}}
@media (prefers-reduced-motion:reduce){.g-item img{transition:none}}
a.btn{text-decoration:none;display:inline-block}

/* likes · saved · final */
.g-item{position:relative}
.g-open{border:0;padding:0;margin:0;width:100%;height:100%;background:none;cursor:pointer;display:block}
.g-like{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:rgba(255,255,255,.88);color:#8a948f;box-shadow:0 1px 4px rgba(0,0,0,.18);transition:transform .12s}
.g-like:hover{transform:scale(1.08)}
.g-like.on{background:var(--accent);color:var(--accent-ink)}
.g-zoom{position:absolute;bottom:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;display:grid;place-items:center;cursor:zoom-in;background:rgba(255,255,255,.88);color:#3a4440}
.g-check{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:none;place-items:center;font-weight:700}
.g-pick .g-item{outline:3px solid transparent;outline-offset:-3px}
.g-pick .g-item.sel{outline-color:var(--accent)}
.g-pick .g-item.sel .g-check{display:grid}
.g-saved{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.g-saved.has{color:var(--accent);border-color:var(--accent)}
.g-saved b{font-family:var(--f-mono);min-width:1.4em;text-align:center}
.g-bar{display:flex;justify-content:flex-end;padding-top:18px}
.g-title{font-size:22px}
.g-guide{margin-bottom:14px}
.g-decide{position:sticky;bottom:0;display:flex;justify-content:flex-end;align-items:center;gap:16px;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px));margin-top:18px;background:var(--bg);border-top:1px solid var(--line)}
.g-btn:disabled{opacity:.45;cursor:not-allowed}
.g-like-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:600;white-space:nowrap}
.g-like-btn.on{background:var(--accent);color:var(--accent-ink)}
.g-confirm{max-width:720px}
.g-confirm h2{font-size:22px}
.g-done{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:40px;text-align:center}
.g-done img{max-width:min(960px,100%);border-radius:12px;display:block}
.g-done h1{font-size:26px}
.g-exit{margin-top:24px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 16px;font-size:13px;cursor:pointer}
.g-exit:hover{color:var(--ink);border-color:var(--muted)}
.g-notify{border:0;background:none;padding:6px 10px;color:var(--muted);font:inherit;cursor:pointer;border-radius:6px}
.g-notify:hover{color:var(--ink)}
.g-done-kicker{color:var(--accent);font-weight:700}
.g-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.g-strip figure{margin:0;flex:0 0 160px;display:flex;flex-direction:column;gap:4px}
.g-strip img{width:160px;aspect-ratio:3/2;object-fit:cover;border-radius:6px;border:3px solid transparent}
.g-strip figure.fin img{border-color:var(--accent)}
.g-strip figcaption{font-size:11px;color:var(--muted);word-break:break-all}
@media (prefers-reduced-motion:reduce){.g-like{transition:none}}

.arch h3{font-size:18px}
.arch-label{width:min(240px,100%)!important;padding:6px 10px!important;font-size:17px;font-weight:700}
#pid-in,#who-in{font-size:20px;padding:12px 14px}
#start-form{width:min(480px,100%);display:flex;flex-direction:column;gap:6px}
#start-form label{margin-top:8px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--research-soft);color:var(--research)}
.ph-missing{width:160px;aspect-ratio:3/2;border-radius:6px;background:var(--sunk);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.q-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.q-list li{line-height:1.5}
.q-tag{display:block;margin-top:2px;color:var(--accent);font-weight:600}
</style>

<div class="wrap">
  <header class="topbar"><div class="brand" id="brand">방 사진 검색</div><div id="topright"></div></header>
  <main id="main"></main>
</div>
<button id="rx-toggle" aria-label="연구자 패널" title="연구자 패널 (Ctrl+Shift+R)"></button>
<div id="rx-panel" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ================= 설정값 ================= */
const TARGETS = [
  {id:'plant', name:'식물', kw:['식물','화분','몬스테라','선인장','다육','plant','plants','greenery','꽃']},
  {id:'rug', name:'러그', kw:['러그','카펫','카페트','rug','carpet']},
  {id:'lamp', name:'스탠드 조명', kw:['스탠드','램프','무드등','lamp']},
  {id:'art', name:'벽 그림', kw:['그림','액자','포스터','art','poster','painting','frame']},
  {id:'warm', name:'따뜻한 조명', kw:['간접조명','전구색','노란조명','warm light']},
  {id:'bedding', name:'겹친 침구', kw:['호텔침구','쿠션','블랭킷','throw','pillows']}
];
// 방 종류(침실·원룸 등)는 태그로 달지 않는다: 그런 검색어로는 결과가 걸러지지 않게 하기 위함
// 타깃 요소(식물·러그·액자·스탠드·따뜻한조명)도 태그로 단다. 비율 조정용 표시는 contains에 따로 둔다
const TAG_GROUPS = [
  {name:'분위기', tags:['아늑한','차분한','따뜻한','시원한','활기찬','몽환적','고급스러운']},
  {name:'스타일', tags:['모던','미니멀','북유럽','내추럴','빈티지','미드센추리','보헤미안','재패니즈','호텔','인더스트리얼','앤틱']},
  {name:'색', tags:['화이트','베이지','브라운','그레이','블랙','그린','민트','블루','옐로','오렌지','핑크','레드','파스텔']},
  {name:'빛·시간대', tags:['밝은','어두운','햇살','노을','저녁']},
  {name:'소재·질감', tags:['우드','라탄','패브릭','가죽','대리석','콘크리트','퍼','유리','금속']},
  {name:'패턴', tags:['체크','스트라이프','플라워','기하학']},
  {name:'가구', tags:['책상','테이블','소파','수납장','책장','옷장','행거','화장대','거울','커튼','블라인드','TV']},
  {name:'침대', tags:['바닥매트리스','저상형','수납침대','헤드보드']},
  {name:'조명', tags:['스탠드','따뜻한조명','펜던트','종이조명','줄조명']},
  {name:'소품·장식', tags:['식물','러그','액자','사진벽','꽃','인형','책','시계','빔프로젝터','턴테이블']},
  {name:'생활감', tags:['깔끔한','생활감','맥시멀']},
  {name:'공간·전망', tags:['넓은','좁은','큰창문','다락','복층','높은천장','곡선','시티뷰','산뷰']},
  {name:'반려동물', tags:['고양이','강아지']}
];

const DB = (() => {
  let p = null;
  const open = () => p || (p = new Promise(res => { try{ const r = indexedDB.open('room-search-pool', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos', {keyPath:'id'}); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }catch(e){ res(null); } }));
  const tx = async (mode, fn) => { const db = await open(); if (!db) return null; return new Promise(res => { try{ const t = db.transaction('photos', mode), st = t.objectStore('photos'); const out = fn(st); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => res(null); }catch(e){ res(null); } }); };
  return {
    all: () => tx('readonly', st => st.getAll()),
    put: rec => tx('readwrite', st => st.put(rec)).finally(poolPing),
    del: id => tx('readwrite', st => st.delete(id)).finally(poolPing),
    clear: () => tx('readwrite', st => st.clear()).finally(poolPing)
  };
})();

function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){ const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ','){ row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c; }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  const clean = rows.filter(r => r.some(x => x.trim() !== '')); if (!clean.length) return [];
  const head = clean[0].map(h => h.trim().replace(/^﻿/,''));
  return clean.slice(1).map(r => Object.fromEntries(head.map((h,i) => [h, (r[i] ?? '').trim()])));
}
const csvCell = v => { const s = Array.isArray(v) ? v.join(';') : String(v ?? ''); return /[",\n;]/.test(s) && !Array.isArray(v) ? `"${s.replace(/"/g,'""')}"` : (/[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s); };
function hash(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

async function shrink(file, edge){
  const bmp = await createImageBitmap(file).catch(() => null);
  if (!bmp) return null;
  const k = Math.min(1, edge / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(b => res(b), 'image/jpeg', edge === THUMB_EDGE ? .8 : .86));
}
function urlFor(p, kind){

  if (!S.urls[p.id][kind]) S.urls[p.id][kind] = URL.createObjectURL(kind === 'thumb' ? (p.thumb || p.blob) : p.blob);
  return S.urls[p.id][kind];
}

function searchIndex(p){
  const out = new Set();
  p.tags.forEach(t => { out.add(t.toLowerCase()); (SYN[t] || []).forEach(s => out.add(s.toLowerCase())); });
  return [...out];
}
const isExcluded = () => false; // contains는 비율 조정용 표시일 뿐, 검색에서 빼지 않음

// 방·침대 자체를 가리키는 말은 점수에 넣지 않음 ("차분한 방"의 "방"이 자취방·다락방에 걸리지 않게)
const ROOM_WORDS = new Set(['방','방을','방이','침실','원룸','투룸','자취방','거실','집','인테리어','사진','room','rooms','bedroom','interior','photo','침대','bed','beds','벽','천장','공간','컬러','color','오피스텔']);
function tokenize(q){
  const neg = [], pos = [];
  const rest = q.toLowerCase().replace(/(\S+?)\s*(없는|없이|빼고|제외|말고)/g, (_, w) => { neg.push(w); return ' '; });
  rest.split(/[\s,]+/).filter(Boolean).forEach(t => {
    if (t.startsWith('-') && t.length > 1){ neg.push(t.slice(1)); return; }
    if (ROOM_WORDS.has(t)) return;
    const py = t.match(/^(\d+)평$/); // 평수: 10평 이하는 좁은 방으로 본다
    if (py){ if (+py[1] <= 10) pos.push('좁은'); return; }
    pos.push(t);
    const stem = t.replace(/(한|인|의|을|를|이|가|은|는|에|로|으로|같은|느낌|스타일|분위기|있는|처럼|톤|색|이랑|랑|만|하게|게|에서)$/,'');
    if (stem && stem !== t && !ROOM_WORDS.has(stem)) pos.push(stem);
  });
  return {pos:[...new Set(pos)], neg:[...new Set(neg)]};
}
function runSearch(q, seed){
  const {pos, neg} = tokenize(q);
  const scored = usable().map(p => {
    const idx = searchIndex(p);
    // 태그가 검색어를 품으면 1점, 검색어가 태그를 품기만 하면 0.5점 (턴테이블 → 테이블)
    // 한 글자 검색어는 태그·동의어와 똑같을 때만 (비 → 텔레비전, 큰 → 큰창문 같은 오탐 방지)
    const part = t => t.length >= 2 && idx.some(g => g.length >= 2 && t.includes(g));
    const match = t => t.length < 2 ? (idx.includes(t) ? 1 : 0) : idx.some(g => g.includes(t)) ? 1 : part(t) ? .5 : 0;
    if (neg.some(match)) return null;
    return {p, score: pos.reduce((a,t) => a + match(t), 0), tie: hash(seed + q + p.id)};
  }).filter(Boolean);
  const hits = scored.filter(x => x.score > 0).sort((a,b) => b.score - a.score || a.tie - b.tie);
  let list = hits, padded = false;
  if (hits.length < 12){ padded = true; list = hits.concat(scored.filter(x => x.score === 0).sort((a,b) => a.tie - b.tie).slice(0, 24 - hits.length)); }
  const targetTerms = TARGETS.filter(t => S.settings.targets.includes(t.id) && t.kw.some(k => norm(q).includes(norm(k)))).map(t => t.id);
  return {list: list.map(x => x.p), hits: hits.length, padded, pos, neg, targetTerms};
}

async function confirmDelete(btn, list){
  if (!list.length) return;
  if (!btn.dataset.sure){
    btn.dataset.sure = 1; const label = btn.textContent;
    btn.textContent = `${list.length}장을 지웁니다 · 한 번 더 누르기`;
    setTimeout(() => { if (btn.isConnected){ delete btn.dataset.sure; btn.textContent = label; } }, 4000);
    return;
  }
  const ids = new Set(list.map(p => p.id));
  if (ids.size === S.photos.length) await DB.clear(); else for (const id of ids) await DB.del(id);
  ids.forEach(id => { const u = S.urls[id]; if (u){ Object.values(u).forEach(x => URL.revokeObjectURL(x)); delete S.urls[id]; } });
  S.photos = S.photos.filter(p => !ids.has(p.id)); S.selected.clear();
  toast(`${ids.size}장을 삭제했습니다`); renderPool();
}

async function filesFromDrop(dt){
  const out = [];
  const walk = (entry) => new Promise(res => {
    if (entry.isFile) entry.file(f => { out.push(f); res(); }, () => res());
    else if (entry.isDirectory){ const r = entry.createReader(); const readAll = () => r.readEntries(async ents => { if (!ents.length) return res(); for (const en of ents) await walk(en); readAll(); }, () => res()); readAll(); }
    else res();
  });
  const items = Array.from(dt.items || []).map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (items.length){ for (const it of items) await walk(it); return out; }
  return Array.from(dt.files || []);
}
async function addFiles(fileList, meta){
  const files = Array.from(fileList || []);
  const csv = files.find(f => /\.csv$/i.test(f.name));
  const rows = meta || (csv ? parseCSV(await csv.text()) : []);
  const nfc = x => String(x || '').normalize('NFC');
  const byName = new Map(rows.map(r => [nfc((r.file || '').split('/').pop()), r]));
  const imgs = files.filter(f => /^image\//.test(f.type) || /\.(jpe?g|jfif|png|webp|gif|avif|heic)$/i.test(f.name));
  if (!imgs.length){ toast('추가할 사진이 없습니다'); return; }
  const existing = new Set(S.photos.map(p => p.name.normalize('NFC')));
  const prog = $('#prog'); if (prog) prog.hidden = false;
  let added = 0, skipped = 0, failed = 0;
  for (let i = 0; i < imgs.length; i++){
    const f = imgs[i];
    if (existing.has(nfc(f.name))){ skipped++; continue; }
    const [blob, thumb] = await Promise.all([shrink(f, MAX_EDGE), shrink(f, THUMB_EDGE)]);
    if (!blob){ failed++; continue; }
    const r = byName.get(nfc(f.name)) || byName.get(nfc(f.name).replace(/\.[^.]+$/, '.jpg')) || {};
    const rec = {id:uid(), name:nfc(f.name), tags:(r.tags||'').split(/[;|]/).map(t => t.trim()).filter(Boolean), contains:targetIdsFrom(r.contains), blob, thumb, addedAt:Date.now() + i};
    await DB.put(rec); S.photos.push(rec); existing.add(nfc(f.name)); added++;
    if (prog) prog.firstElementChild.style.width = ((i+1)/imgs.length*100) + '%';
  }
  toast(`${added}장 추가${skipped ? ` · 같은 이름 ${skipped}장 건너뜀` : ''}${failed ? ` · 읽지 못한 파일 ${failed}장 (HEIC는 JPG로 바꿔 주세요)` : ''}`);
  renderPool();
}

async function importPool(file){
  if (!file) return;
  if (typeof JSZip === 'undefined'){ toast('ZIP을 열려면 인터넷 연결이 필요합니다. 폴더째 추가해 주세요'); return; }
  const zip = await JSZip.loadAsync(file).catch(() => null); if (!zip){ toast('ZIP 파일을 열 수 없습니다'); return; }
  const csvEntry = Object.values(zip.files).find(f => /pool\.csv$/i.test(f.name));
  const rows = csvEntry ? parseCSV(await csvEntry.async('string')) : [];
  const meta = rows.map(r => Object.assign({}, r, {file: (r.file||'').replace(/\.[^.]+$/, '') + '.jpg'})).concat(rows);
  const files = [];
  for (const f of Object.values(zip.files)){ if (f.dir || !/\.(jpe?g|png|webp)$/i.test(f.name)) continue; const b = await f.async('blob'); files.push(new File([b], f.name.split('/').pop(), {type:'image/jpeg'})); }
  addFiles(files, meta);
}

/* ---------- 저장소의 기본 풀 (pool/pool.csv + pool/photos/) ---------- */
// GitHub Pages처럼 http(s)로 열면 시작할 때 기본 풀을 이 브라우저에 맞춰 넣는다. 파일로 열면(file://) 건너뜀
// 사진 id는 파일 이름에서 만들어 풀을 다시 맞춰도 참여자 기록의 사진 참조가 유지된다
const POOL_DIR = 'pool/';
const canSyncPool = () => /^https?:$/.test(location.protocol);
const poolId = name => 'pool_' + hash(name).toString(36);
// 두 창이 동시에 열려도 한 창만 내려받는다: 받는 창이 rs_pool_lock을 몇 초마다 갱신하고, 다른 창은 끝날 때까지 기다린다
const TAB_ID = uid(), POOL_LOCK = 'rs_pool_lock';
const otherLock = () => { const l = LS.get(POOL_LOCK, null); return l && l.by !== TAB_ID && Date.now() - l.t < 8000 ? l : null; };
const pause = ms => new Promise(r => setTimeout(r, ms));
function showPoolLoading(){
  const el = document.createElement('div'); el.className = 'pool-loading'; el.textContent = '사진을 불러오는 중…'; document.body.appendChild(el);
  return (n, total) => { if (n === null) el.remove(); else el.textContent = `사진을 불러오는 중… ${n} / ${total}`; };
}
async function syncDefaultPool(force){
  if (!canSyncPool()) return false;
  // 사진이 하나도 없으면 다 들어올 때까지 화면을 막는다 (빈 풀에서 참여자를 시작하지 않게)
  let step = S.photos.length ? null : showPoolLoading(), changed = false;
  const done = r => {
    S.syncing = false; if (step) step(null);
    const l = LS.get(POOL_LOCK, null); if (l && l.by === TAB_ID){ try{ localStorage.removeItem(POOL_LOCK); }catch(e){} }
    return r;
  };
  // 잠금을 걸고 잠깐 뒤 다시 읽어 내 것인지 확인한다 (두 창이 동시에 걸면 나중에 쓴 쪽만 남는다)
  const claim = async () => { LS.set(POOL_LOCK, {by: TAB_ID, t: Date.now(), n: 0, total: 0}); await pause(150); const l = LS.get(POOL_LOCK, null); return !!l && l.by === TAB_ID; };
  for (;;){
    if (otherLock()){
      step = step || showPoolLoading();
      for (let l; (l = otherLock()); ){ if (l.total) step(l.n, l.total); await pause(700); }
      await loadPhotos(); changed = true;
    }
    if (await claim()) break;
  }
  S.syncing = true; // 받는 동안 다른 창의 신호로 사진 목록을 다시 읽지 않는다
  const res = await fetch(POOL_DIR + 'pool.csv', {cache:'no-cache'}).catch(() => null);
  if (!res || !res.ok) return done(changed);
  const text = await res.text(), ver = String(hash(text));
  if (!force && LS.get('rs_pool_ver', '') === ver && S.photos.some(p => p.fromPool)) return done(changed);
  const rows = parseCSV(text).filter(r => r.file), total = rows.length, keep = new Set();
  let failed = 0, n = 0, next = 0;
  step = step || showPoolLoading();
  const lock = () => LS.set(POOL_LOCK, {by: TAB_ID, t: Date.now(), n, total});
  lock(); step(0, total);
  const one = async i => {
    const r = rows[i], name = r.file.normalize('NFC'), id = poolId(name);
    const tags = (r.tags || '').split(/[;|]/).map(t => t.trim()).filter(Boolean), contains = targetIdsFrom(r.contains);
    const old = S.photos.find(p => p.id === id);
    if (old){ Object.assign(old, {tags, contains, addedAt:i}); await DB.put(old); keep.add(id); }
    else {
      const blob = await fetch(POOL_DIR + 'photos/' + encodeURIComponent(name)).then(x => x.ok ? x.blob() : null).catch(() => null);
      const thumb = blob && await shrink(blob, THUMB_EDGE);
      if (thumb){ const rec = {id, name, tags, contains, blob, thumb, addedAt:i, fromPool:true}; await DB.put(rec); S.photos.push(rec); keep.add(id); }
      else failed++;
    }
    n++; step(n, total); lock();
  };
  // 6장씩 동시에 받는다
  await Promise.all(Array.from({length: 6}, async () => { while (next < total) await one(next++); }));
  // 기본 풀에서 빠진 사진은 지운다 (연구자가 직접 넣은 사진은 그대로)
  for (const p of S.photos.filter(p => p.fromPool && !keep.has(p.id))) await DB.del(p.id);
  S.photos = S.photos.filter(p => !p.fromPool || keep.has(p.id)).sort((a,b) => a.addedAt - b.addedAt);
  if (!failed) LS.set('rs_pool_ver', ver);
  if (failed) toast(`사진 ${failed}장을 불러오지 못했습니다. 새로고침하면 다시 시도합니다`);
  return done(true);
}

function toggleLike(id){

const HEART = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8.1 3.6 5 6.8 5c2 0 3.4 1.1 4.2 2.4h2C13.8 6.1 15.2 5 17.2 5c3.2 0 5.3 3.1 4.1 6.3-1.8 4.6-9.3 9.2-9.3 9.2z" fill="currentColor"/></svg>';

const savedBtn = () => `<button class="g-saved ${P.liked.length ? 'has' : ''}" id="to-saved" type="button">${HEART}<span>마음에 든 사진</span><b class="g-saved-count">${P.liked.length}</b></button>`;
function tile(p, mode){
  return `<div class="g-item${mode==='pick' && P._sel===p.id ? ' sel' : ''}" data-id="${p.id}">
    <button class="g-open" type="button" aria-label="${mode==='pick' ? '이 사진 고르기' : '크게 보기'}"><img loading="lazy" alt="방 사진" src="${urlFor(p,'thumb')}"></button>
    ${mode==='pick' ? `<button class="g-zoom" type="button" data-zoom="${p.id}" aria-label="크게 보기"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 0 1 5.2 10.4l4.4 4.4-1.4 1.4-4.4-4.4A6.5 6.5 0 1 1 10.5 4zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z" fill="currentColor"/></svg></button><span class="g-check" aria-hidden="true">✓</span>` : ''}
    <button class="g-like${isLiked(p.id) ? ' on' : ''}" type="button" data-like="${p.id}" aria-pressed="${isLiked(p.id)}">${HEART}</button>

function fitTiles(box){
  $$('.g-item', box).forEach(t => { const img = t.querySelector('img'); const fit = () => { if (img.naturalWidth) t.style.flexBasis = Math.round(190 * img.naturalWidth / img.naturalHeight) + 'px'; }; img.complete ? fit() : img.addEventListener('load', fit); });
}
function bindLikeButtons(root){ $$('[data-like]', root).forEach(b => b.onclick = e => { e.stopPropagation(); toggleLike(b.dataset.like); if (P.view === 'saved') renderSearchUI(); }); }

function renderSearchUI(){
  document.body.classList.add('search-mode');
  $('#brand').textContent = ''; $('#topright').innerHTML = '';
  if (SEARCH_PAGE && (!P.pid || S.nextUp)) return renderStartUI();
  if (P.final) return renderDoneUI();

  if (!S.lastQuery){
    $('#main').innerHTML = `<div class="g-bar g-bar-home">${savedBtn()}</div><div class="g-home">
      <form class="g-form" id="gform" role="search"><input type="search" id="q" aria-label="검색어" autocomplete="off"><button class="g-btn">검색</button></form></div>`;
  } else {
    $('#main').innerHTML = `<div class="g-top">
      <form class="g-form" id="gform" role="search"><input type="search" id="q" aria-label="검색어" autocomplete="off" value="${esc(S.lastQuery)}"><button class="g-btn">검색</button></form>${savedBtn()}</div>
      <div class="g-grid" id="results"></div>

function drawResults(){
  const box = $('#results'); if (!box) return;

  fitTiles(box); bindLikeButtons(box);

// 검색 화면 전용 시작 화면: 연구자가 진행자·참여자 ID를 넣고 참여자에게 넘긴다
function renderStartUI(){
  $('#main').innerHTML = `<div class="g-home"><form class="panel g-confirm" id="start-form" aria-label="참여자 시작">

    <label class="small muted" for="who-in">진행자</label><input type="text" id="who-in" value="${esc(LS.get(WHO_KEY, ''))}" placeholder="예: 의현" autocomplete="off">

function openPreview(id, list, fromSaved){
  const p = photoById(id); if (!p) return;
  const i = list.findIndex(x => x.id === id);
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-label="이미지 크게 보기">
    <img alt="방 사진" src="${urlFor(p,'full')}">
    <div class="row between"><div class="row"><button class="btn sm" data-nav="-1" ${i <= 0 ? 'disabled' : ''}>← 이전</button><button class="btn sm" data-nav="1" ${i >= list.length - 1 ? 'disabled' : ''}>다음 →</button></div>
    <div class="row"><button class="btn" data-close type="button">닫기</button>${fromSaved ? `<button class="g-btn" id="pick-this" type="button">이 사진 고르기</button>` : `<button class="g-like-btn${isLiked(id) ? ' on' : ''}" type="button" data-like="${id}" aria-pressed="${isLiked(id)}">${HEART}<span data-like-label="${id}">${isLiked(id) ? '마음에 든 사진에 담김' : '마음에 들어요'}</span></button>`}</div></div></div>`;
  const close = () => { m.remove(); document.removeEventListener('keydown', onKey); };
  const go = d => { const n = list[i + d]; if (n){ close(); openPreview(n.id, list, fromSaved); } };
  const onKey = e => { if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); };
  m.onclick = e => { if (e.target === m || e.target.dataset.close != null) close(); };
  $$('[data-nav]', m).forEach(b => b.onclick = () => go(Number(b.dataset.nav)));
  $$('[data-like]', m).forEach(b => b.onclick = () => toggleLike(id));
  const pk = $('#pick-this', m); if (pk) pk.onclick = () => { P._sel = id; savePick(); close(); renderSearchUI(); };
  document.addEventListener('keydown', onKey);
  document.body.appendChild(m);
}

/* ---------- 참여자 기록 (아카이브) ---------- */
const ARCH_KEY = 'rs_archive';
let ARCH = LS.get(ARCH_KEY, []);
const saveArch = () => LS.set(ARCH_KEY, ARCH);
const reloadArch = () => { ARCH = LS.get(ARCH_KEY, []); }; // 고치기 전에 다른 창의 최신 기록부터 읽는다
const WHO_KEY = 'rs_researcher'; // 이 PC의 진행자 이름. 기록마다 붙어 나중에 세 사람 기록을 합칠 때 구분한다
const fileTag = () => { const w = LS.get(WHO_KEY, '').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 20); return (w ? w + '_' : '') + new Date().toISOString().slice(0,10); };
const refOf = id => { const p = photoById(id); return {id, name: p ? p.name : id}; };
const likedRef = id => { const add = (P.likeLog || []).filter(e => e.id === id && e.action === '담기').pop(); return Object.assign(refOf(id), add ? {qn: add.qn, q: add.q, likedAt: add.at} : {}); };
function archiveCurrent(status){
  reloadArch();
  const no = (ARCH.reduce((m, r) => Math.max(m, r.no || 0), 0)) + 1;
  const rec = {id: 'a' + Date.now().toString(36), no, label: P.pid || '', researcher: LS.get(WHO_KEY, ''), note: '', status,
    startedAt: P.startedAt, finishedAt: P.finishedAt || new Date().toISOString(),
    liked: P.liked.map(likedRef), final: P.final ? refOf(P.final) : null, queries: (P.queries || []).slice(),
    likeLog: (P.likeLog || []).map(e => Object.assign({}, e, {name: refOf(e.id).name}))};
  ARCH.push(rec); saveArch(); P.archivedId = rec.id;
}
const fmtTime = iso => { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('ko-KR', {month:'numeric', day:'numeric'}) + ' ' + d.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'}); };
const durMin = r => r.startedAt && r.finishedAt ? Math.max(0, Math.round((Date.parse(r.finishedAt) - Date.parse(r.startedAt)) / 60000)) + '분' : '—';
function thumbHTML(ref, isFinal){
  const p = photoById(ref.id);
  return `<figure class="${isFinal ? 'fin' : ''}">${p ? `<img alt="" src="${urlFor(p,'thumb')}">` : `<div class="ph-missing">풀에 없음</div>`}<figcaption>${isFinal ? '최종 · ' : ''}${esc(ref.name)}${ref.qn ? `<span class="q-tag">${ref.qn}번째 검색 · ${esc(ref.q)}</span>` : ''}</figcaption></figure>`;
}
function renderArchive(){
  const list = ARCH.slice().reverse();
  const done = ARCH.filter(r => r.status === '완료').length;
  $('#body').innerHTML = `<div class="stack">
    <div class="row"><label class="small" for="who">진행자</label><input type="text" id="who" value="${esc(LS.get(WHO_KEY, ''))}" placeholder="예: 의현" autocomplete="off" style="width:160px"><span class="small muted">이 PC에서 진행하는 사람. 새 기록과 CSV 파일 이름에 붙습니다</span></div>
    <div class="row between"><p class="small muted">최종 선택을 마치면 자동으로 기록됩니다. 최종 선택 전에 다음 참여자로 넘어가면 "미완료"로 남습니다. · 완료 <b class="mono">${done}</b> · 전체 <b class="mono">${ARCH.length}</b></p>
      <div class="row"><button class="btn sm" id="arch-csv" ${ARCH.length ? '' : 'disabled'}>CSV 내보내기</button><button class="btn sm" id="arch-zip" ${ARCH.length ? '' : 'disabled'}>기록 + 최종 사진 (ZIP)</button></div></div>
    ${list.length ? list.map(r => `<div class="card stack arch" data-arch="${r.id}">
      <div class="row between">
        <div class="row"><span class="mono small muted">#${r.no}</span><input type="text" class="arch-label" data-f="label" value="${esc(r.label)}" placeholder="참여자 ID" aria-label="참여자 ID (#${r.no})"><span class="pill ${r.status === '완료' ? 'ok' : 'warn'}">${r.status}</span></div>
        <div class="row">${r.final && photoById(r.final.id) ? `<a class="btn sm" href="${urlFor(photoById(r.final.id),'full')}" download="P${r.no}_FINAL_${esc(r.final.name.replace(/\.[^.]+$/, ''))}.jpg">최종 사진 저장</a>` : ''}<button class="btn sm danger" data-del="${r.id}" type="button">기록 삭제</button></div>
      </div>
      <dl class="kv"><dt>진행자</dt><dd>${esc(r.researcher || '—')}</dd><dt>${r.status === '완료' ? '결정 시각' : '기록 시각'}</dt><dd class="mono">${fmtTime(r.finishedAt)} (첫 검색부터 ${durMin(r)})</dd>
        <dt>검색어 (${(r.queries || []).length}회)</dt><dd>${(r.queries || []).length ? `<ol class="q-list">${r.queries.map(x => `<li><span class="mono small muted">${new Date(x.at).toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', second:'2-digit'})}</span> ${esc(x.q)}</li>`).join('')}</ol>` : '—'}</dd>
        <dt>마음에 든 사진</dt><dd class="mono">${r.liked.length}장</dd>
        <dt>최종 사진</dt><dd class="mono" style="word-break:break-all">${r.final ? esc(r.final.name) : '—'}</dd></dl>
      <div class="g-strip">${r.liked.map(ref => thumbHTML(ref, r.final && ref.id === r.final.id)).join('') || '<p class="small muted">담은 사진 없음</p>'}</div>
    </div>`).join('') : '<div class="empty card">아직 기록이 없습니다. 참여자가 최종 사진을 고르면 여기에 쌓입니다.</div>'}
  </div>`;
  $('#who').oninput = e => LS.set(WHO_KEY, e.target.value.trim());
  $$('.arch-label').forEach(inp => inp.oninput = () => { reloadArch(); const r = ARCH.find(x => x.id === inp.closest('[data-arch]').dataset.arch); if (r){ r.label = inp.value; saveArch(); } });
  $$('[data-del]').forEach(b => b.onclick = () => {
    if (!b.dataset.sure){ b.dataset.sure = 1; b.textContent = '한 번 더 누르면 삭제'; setTimeout(() => { if (b.isConnected){ delete b.dataset.sure; b.textContent = '기록 삭제'; } }, 4000); return; }
    reloadArch(); ARCH = ARCH.filter(r => r.id !== b.dataset.del); saveArch(); render();
  });
  const csv = $('#arch-csv'); if (csv) csv.onclick = () => download(`search_participants_${fileTag()}.csv`, '﻿' + archiveCSV(), 'text/csv');
  const zp = $('#arch-zip'); if (zp) zp.onclick = exportArchiveZip;
}
function archiveCSV(){
  const cell = v => { const x = String(v ?? ''); return /[",\n]/.test(x) ? `"${x.replace(/"/g,'""')}"` : x; };
  const head = ['no','researcher','participant_id','status','started_at','finished_at','query_count','queries','liked_count','liked_with_query','unliked_count','final_query','liked_files','final_file','final_in_liked_order'];
  const rows = ARCH.map(r => [r.no, r.researcher || '', r.label, r.status, r.startedAt || '', r.finishedAt || '', (r.queries || []).length, (r.queries || []).map(x => x.q).join(' | '), r.liked.length, r.liked.map(x => `${x.name}@${x.qn ? x.qn + ':' + x.q : '-'}`).join(' | '), (r.likeLog || []).filter(e => e.action === '빼기').length, (() => { const f = r.final && r.liked.find(x => x.id === r.final.id); return f && f.qn ? `${f.qn}:${f.q}` : ''; })(), r.liked.map(x => x.name).join('|'), r.final ? r.final.name : '', r.final ? r.liked.findIndex(x => x.id === r.final.id) + 1 : '']);
  return [head.join(','), ...rows.map(r => r.map(cell).join(','))].join('\n');
}
async function exportArchiveZip(){
  if (typeof JSZip === 'undefined'){ toast('ZIP을 만들려면 인터넷 연결이 필요합니다. CSV로 받아 주세요'); return; }
  toast('ZIP을 만드는 중…');
  const zip = new JSZip();
  zip.file('participants.csv', '﻿' + archiveCSV());
  zip.file('participants.json', JSON.stringify(ARCH, null, 1));
  for (const r of ARCH){
    const dir = `${r.researcher ? r.researcher.replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 20) + '_' : ''}P${String(r.no).padStart(2,'0')}${r.label ? '_' + r.label.replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 30) : ''}/`;
    for (const ref of r.liked){ const p = photoById(ref.id); if (p) zip.file(dir + (r.final && ref.id === r.final.id ? 'FINAL_' : 'liked_') + ref.name.replace(/\.[^.]+$/, '') + '.jpg', p.blob); }
  }
  download(`search_participants_${fileTag()}.zip`, await zip.generateAsync({type:'blob'}), 'application/zip');
}

  const b = $('#rx-back'); if (b) b.onclick = () => { S.mode = null; p.hidden = true; render(); };
}
const toggleRx = () => { const p = $('#rx-panel'); p.hidden = !p.hidden; renderRx(); };
$('#rx-toggle').onclick = toggleRx;
$('#rx-toggle').hidden = !!VIEW; // 화면을 나눠 열면 연구자 패널을 쓰지 않는다 (검색 화면에서 연구자 화면으로 가는 길 없음)
document.addEventListener('keydown', e => { if (!VIEW && e.ctrlKey && e.shiftKey && (e.key === 'R' || e.key === 'r')){ e.preventDefault(); toggleRx(); } });

/* ---------- 다른 창의 변경 받기 (연구자 창 ↔ 검색 창) ---------- */
let poolTimer = null;
// 연구자 화면을 새로 그린다. 기록의 참여자 ID나 태그를 고치는 중이면 건너뛰고, 진행자 칸에 있던 커서는 되돌린다
function rerenderResearcher(){
  const a = document.activeElement;
  if (a && a.matches('.arch-label, #editor input')) return;
  const refocus = a && a.id === 'who';
  render();
  const w = refocus && $('#who'); if (w){ w.focus(); w.setSelectionRange(w.value.length, w.value.length); }
}
window.addEventListener('storage', e => {
  if (e.key === ARCH_KEY){
    reloadArch();
    if (S.mode !== 'search') rerenderResearcher();
  }
  if (e.key === PICK_KEY){
    reloadPick();
    if (RESEARCH_PAGE) rerenderResearcher(); // 진행 중 표시 갱신
    else if (SEARCH_PAGE && !P.pid){ S.nextUp = false; S.lastQuery = ''; render(); } // 연구자 창에서 "미완료로 끝내기"
  }
  if (e.key === 'rs_pool_ping' && !S.syncing){
    clearTimeout(poolTimer);
    poolTimer = setTimeout(async () => { if (S.syncing) return; await loadPhotos(); if (S.mode !== 'search' && (S.rtab || 'pool') === 'pool' && !document.querySelector('.pool-loading')) render(); }, 800);
  }
});

/* ---------- 시작 ---------- */
(async () => { await loadPhotos(); if (P.active) S.mode = 'search'; render(); if (await syncDefaultPool()) render(); })();
</script>
