<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>검색</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 디자인 토큰: 흰 바탕 + 따뜻한 회색, 강조색은 짙은 먹색 하나. 모서리는 16px / 32px(모달) / 알약형만, 그림자 없음(모달 뒤 어둡게 깔리는 막만)
   참여자 화면 = 위 고정 검색창 + 사진 비율 그대로의 칸 쌓기(masonry, layoutMasonry). 연구자 화면은 같은 토큰에 호박색 띠로 구분 */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --card:#F6F6F3; --sunk:#F6F6F3; --sec:#E5E5E0; --sec-press:#C8C8C1;
  --ink:#1D1D1A; --body:#33332E; --muted:#62625B; --ash:#91918C; --line:#DADAD3; --line-soft:#E5E5E0;
  --accent:#262622; --accent-press:#000000; --accent-ink:#FFFFFF; --accent-soft:#ECECE7;
  --research:#7A4C0C; --research-soft:#FBEFD9; --danger:#9E0A0A; --danger-soft:#FBE6E3;
  --scrim:rgba(17,17,15,.55);
  --r:16px; --r-lg:32px; --pill:999px;
  --f-body:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-mono:var(--f-body); /* 숫자는 본문 글꼴의 고정폭 숫자(tabular-nums)로. 한글이 섞인 줄에서 고정폭 글꼴이 튀지 않게 */
}
/* 늘 밝은 화면만 쓴다 (2026-10-27.5부터 다크 모드 없음: 참여자마다 사진이 놓이는 바탕이 달라지지 않게) */
:root{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scrollbar-gutter:stable}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--body);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25;color:var(--ink)} h1{font-size:24px;font-weight:700;letter-spacing:-.01em} h2{font-size:20px;font-weight:700} h3{font-size:15px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto}
body.search-mode .wrap{max-width:1680px}
.topbar{display:flex;align-items:center;gap:12px;justify-content:space-between;min-height:64px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{font-weight:700;color:var(--ink);font-size:16px;white-space:nowrap}
@media (max-width:767px){.topbar{flex-wrap:wrap}#topright{width:100%}#topright .live-box{justify-content:flex-start}}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
/* 버튼: 기본 = 회색 면(secondary), primary = 먹색. 높이 40 / sm 32 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;border:0;background:var(--sec);color:var(--ink);border-radius:var(--r);min-height:40px;padding:0 16px;cursor:pointer;font-weight:600;font-size:14px;line-height:1;text-decoration:none}
.btn:hover{background:var(--sec-press)}
.btn:active{background:var(--sec-press)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover,.btn.primary:active{background:var(--accent-press)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--sec)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px}
.btn.lg{min-height:48px;padding:0 24px;font-size:15px;border-radius:var(--pill)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:var(--sec)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=password],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 14px;min-height:40px;width:100%;color:var(--ink)}
input:focus{border-color:var(--ash);outline:none}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select{min-height:32px;padding:0 8px 0 12px;font-size:13px;cursor:pointer}
#who{min-height:36px}
.research-strip{display:flex;align-items:center;gap:8px;background:var(--research-soft);color:var(--research);border-radius:var(--r);padding:10px 14px;font-size:13px;font-weight:600}
.research-strip::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--research)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:12px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.stats{display:flex;gap:28px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stats b{font-family:var(--f-mono);font-size:20px;display:block;color:var(--ink);font-weight:600}
/* 사진 풀 관리 */
.manager{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.manager.solo{grid-template-columns:1fr}
@media (max-width:900px){.manager{grid-template-columns:1fr}}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted);background:var(--card)}
.drop b{color:var(--ink)}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-items:start}
.pitem{position:relative;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;border:0;border-radius:var(--r);overflow:hidden;background:var(--card);cursor:pointer;padding:0;text-align:left;outline:2px solid transparent;outline-offset:2px}
.pitem[aria-pressed=true]{outline-color:var(--accent)}
.pitem img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--sunk)}
.pitem .meta{padding:8px 10px;font-size:12px;color:var(--muted);line-height:1.4;min-height:40px;word-break:break-all}
.pitem .flag{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;border-radius:var(--pill);padding:2px 8px}
.flag.ex{background:var(--danger);color:#fff}
.flag.none{background:var(--research);color:#fff}
.editor{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto}
.editor img{border-radius:var(--r)!important}
.taggroup{display:flex;flex-direction:column;gap:6px}
.taggroup>span{font-size:12px;color:var(--muted);font-weight:600}
.tagbtns{display:flex;flex-wrap:wrap;gap:4px}
.tagbtn{border:0;background:var(--card);border-radius:var(--pill);padding:4px 10px;font-size:13px;cursor:pointer;color:var(--body)}
.tagbtn:hover{background:var(--sec)}
.tagbtn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.tagbtn[aria-pressed=mixed]{background:var(--sec-press);color:var(--ink)}
.tagbtn.target[aria-pressed=true]{background:var(--danger);color:#fff}
.tagbtn.target[aria-pressed=mixed]{background:var(--danger-soft);color:var(--danger)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);white-space:nowrap}
td.num{text-align:right;font-family:var(--f-mono)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px} .kv dt{color:var(--muted)} .kv dd{margin:0;color:var(--ink)}
.pool-loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--muted);z-index:80;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:var(--pill);z-index:70;font-size:14px;font-weight:500;max-width:calc(100vw - 32px)}
.toast.undo{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 20px;white-space:nowrap}
.toast.undo button{border:0;background:transparent;color:inherit;font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:40px;padding:0 14px;border-radius:var(--pill);cursor:pointer}
.toast.undo button:hover{background:rgba(255,255,255,.14)}
#rx-toggle{position:fixed;right:8px;bottom:8px;width:14px;height:14px;border-radius:50%;border:0;background:var(--line);opacity:.5;cursor:pointer;z-index:60}
#rx-panel{position:fixed;right:12px;bottom:32px;width:min(320px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--research);border-radius:var(--r);padding:14px;z-index:61;display:flex;flex-direction:column;gap:10px}
.prog-bar{height:6px;border-radius:3px;background:var(--sec);overflow:hidden}.prog-bar i{display:block;height:100%;background:var(--accent)}
.empty{padding:48px 20px;text-align:center;color:var(--muted);line-height:1.7}
a.btn{text-decoration:none}

/* 모달: 어두운 막 + 32px 모서리 카드 */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
.modal .panel{background:var(--surface);color:var(--body);border-radius:var(--r-lg);max-width:1000px;width:100%;max-height:100%;overflow:auto;padding:28px;display:flex;flex-direction:column;gap:14px}
.g-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:var(--pill);min-height:44px;padding:0 22px;cursor:pointer;font-weight:700;font-size:15px;white-space:nowrap}
.g-btn:hover,.g-btn:active{background:var(--accent-press)}
.g-btn:disabled{opacity:.35;cursor:not-allowed}
.g-btn:disabled:hover{background:var(--accent)}

/* ===== 참여자 화면 ===== */
body.search-mode .topbar{display:none}
/* 검색창: 회색 면 알약, 왼쪽 돋보기(누르면 검색), 그림자 없음 */
.g-form{display:flex;align-items:center;width:100%;height:48px;border:1px solid transparent;border-radius:var(--pill);background:var(--card);padding:0 16px 0 4px}
.g-form:focus-within{background:var(--surface);border-color:var(--ash)}
.g-form input{flex:1;min-width:0;border:0;background:none;font-size:16px;height:100%;padding:0 4px;outline:none;color:var(--ink);min-height:0}
.g-form input:focus,.g-form input:focus-visible{outline:none;border:0}
.g-form input::-webkit-search-cancel-button{cursor:pointer}
.g-go{flex:none;display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:none;color:var(--muted);cursor:pointer;padding:0}
.g-go:hover{color:var(--ink);background:var(--sec)}
/* 홈 */
.g-bar{display:flex;justify-content:flex-end;padding-top:16px}
.g-home{min-height:72vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding-top:24px}
.g-home .g-form{width:min(640px,100%)}
.g-task{color:var(--muted);font-size:17px;line-height:1.6;text-align:center;max-width:760px;margin:0;word-break:keep-all;text-wrap:balance}
.g-task>span{display:inline-block} /* 두 문장이 한 줄에 안 들어가면 문장 단위로 줄을 바꾼다 */
/* 첫 화면 검색창 아래 시작 단어 (STARTER_CHIPS). 누르면 그 말로 검색. 결과 화면에는 없다 */
.g-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:min(640px,100%);margin:0;padding:0;list-style:none}
.g-chip{display:inline-flex;align-items:center;min-height:40px;padding:0 18px;border:0;border-radius:var(--pill);background:var(--card);color:var(--body);font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap}
.g-chip:hover{background:var(--sec);color:var(--ink)}
.g-chip:active{background:var(--sec-press)}
/* 결과 화면 위 고정 머리: 가운데 검색창 + 오른쪽 "담은 사진 N", 아래 과제 안내 한 줄 */
.g-top{position:sticky;top:0;z-index:30;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,720px) minmax(0,1fr);align-items:center;column-gap:16px;row-gap:6px;padding-block:12px 10px;margin-bottom:16px;
  box-shadow:0 0 0 100vmax var(--bg),0 1px 0 100vmax var(--line);clip-path:inset(0 -100vmax -1px)}
.g-top .g-form{grid-column:2}
.g-top .g-saved{grid-column:3;justify-self:end}
.g-task.sm{grid-column:1/-1;justify-self:center;max-width:960px;font-size:14px;text-align:center;line-height:1.5;padding-inline:8px}
.g-saved{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--card);border-radius:var(--pill);height:48px;padding:0 18px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.g-saved:hover{background:var(--sec)}
.g-saved .hrt path{fill:currentColor;stroke:none}
.g-saved.has{color:var(--ink)}
.g-saved b{font-variant-numeric:tabular-nums;font-weight:700;min-width:1ch;text-align:center}
@media (max-width:767px){
  .g-top{grid-template-columns:minmax(0,1fr) auto;column-gap:8px;padding-block:10px 8px;margin-bottom:12px}
  .g-top .g-form{grid-column:1}.g-top .g-saved{grid-column:2}
  .g-task.sm{grid-column:1/-1;justify-self:stretch;text-align:left;padding-inline:4px;font-size:13.5px}
  .g-top .g-saved{padding:0 14px}.g-top .g-saved .lbl{display:none}
}
/* 사진 칸 쌓기: 칸 위치·크기는 layoutMasonry가 사진 비율(ar)로 정한다 (자르지 않음, 순위대로 가장 짧은 열에) */
.g-grid{position:relative;width:100%}
.g-grid>.empty{position:static}
.g-item{position:absolute;left:0;top:0;border-radius:var(--r);overflow:hidden;background:var(--card)}
.g-open{display:block;border:0;padding:0;margin:0;width:100%;height:100%;background:none;cursor:zoom-in;position:relative}
.g-open img{display:block;width:100%;height:100%;object-fit:cover}
.g-open::after{content:"";position:absolute;inset:0;background:#000;opacity:0;transition:opacity .15s}
.g-open:hover::after{opacity:.08}
.g-pick .g-open{cursor:pointer}
/* 담기 버튼: 사진 오른쪽 위, 늘 보이는 하트만 있는 동그란 버튼(보이는 크기 36px, 누르는 영역은 ::before로 44px). 담으면 먹색 바탕 + 흰 하트 */
.g-like{position:absolute;top:8px;right:8px;display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:50%;cursor:pointer;
  background:rgba(255,255,255,.9);color:#262622;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.g-like::before{content:"";position:absolute;inset:-4px;border-radius:50%}
.g-like:hover{background:#fff}
.g-like.on{background:#262622;color:#fff;box-shadow:none}
.g-like.on:hover{background:#000}
/* 모아 보기에서 빼기(×): 오른쪽 위, 보이는 크기 32px, 누르는 영역 44px */
.g-remove{position:absolute;top:8px;right:8px;display:grid;place-items:center;width:32px;height:32px;padding:0;border:0;border-radius:50%;cursor:pointer;
  background:rgba(255,255,255,.9);color:#262622;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.g-remove::before{content:"";position:absolute;inset:-6px;border-radius:50%}
.g-remove:hover{background:#fff}
.hrt{flex:none;display:block}
.hrt path{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.on .hrt path{fill:currentColor;stroke:currentColor}
.g-zoom{position:absolute;bottom:8px;right:8px;width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;cursor:zoom-in;background:rgba(255,255,255,.94);color:#262622;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.g-zoom:hover{background:#fff}
.g-check{position:absolute;top:8px;left:8px;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:none;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.g-pick .g-item{overflow:visible}
.g-pick .g-open{border-radius:var(--r);overflow:hidden}
.g-pick .g-item.sel{outline:3px solid var(--accent);outline-offset:2px}
.g-pick .g-item.sel .g-check{display:grid}
@media (max-width:767px){.g-like,.g-remove{top:6px;right:6px}.g-zoom{bottom:6px;right:6px}.g-check{top:6px;left:6px}}
@media (prefers-reduced-motion:reduce){.g-open::after{transition:none}}
.g-more{display:flex;justify-content:center;margin-top:24px}
.g-none{padding:48px 0;text-align:center;color:var(--muted)}
/* 맞는 사진이 적어 나머지로 채운 검색: 맞는 사진 → "다른 사진" 구분 줄 → 채운 사진 (두 masonry 묶음) */
.g-divider{display:flex;align-items:center;gap:16px;margin:32px 0 16px;color:var(--muted);font-size:14px;font-weight:600}
.g-divider::before,.g-divider::after{content:"";flex:1;height:1px;background:var(--line)}
.g-note{margin:4px 0 16px;color:var(--muted);font-size:15px;text-align:center}
@media (max-width:767px){.g-divider{margin:24px 0 12px}.g-note{font-size:14px;margin:0 0 12px}}
/* 담은 사진이 있으면 아래에 고르러 가는 줄 */
.g-finish{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.g-finish .g-btn{min-height:48px;font-size:15px;padding:0 28px;max-width:100%}
body.has-finish #main{padding-bottom:80px}
/* 모아 보기 */
.g-head{position:sticky;top:0;z-index:30;background:var(--bg);display:flex;align-items:center;gap:16px;padding-block:12px;margin-bottom:16px;flex-wrap:wrap;
  box-shadow:0 0 0 100vmax var(--bg),0 1px 0 100vmax var(--line);clip-path:inset(0 -100vmax -1px)}
.g-title{font-size:20px;font-weight:700}
.g-title b{font-variant-numeric:tabular-nums}
.g-guide{margin:0 0 16px;color:var(--muted);font-size:15px;word-break:keep-all}
#saved{margin-bottom:96px}
.g-decide{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;align-items:center;gap:16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.g-decide .g-btn{min-height:48px;padding:0 28px}
/* 크게 보기: 넓은 화면 = 사진 왼쪽 + 오른쪽 버튼 열, 좁은 화면 = 버튼 줄이 사진 위. 사진 크기는 sizePreview가 화면 안에 맞춘다 */
.modal .panel.pv{max-width:none;width:auto;padding:16px;gap:24px;flex-direction:row-reverse;align-items:stretch;overflow:hidden}
.pv-img{display:block;border-radius:var(--r);background:var(--card);object-fit:contain;flex:none}
.pv-side{flex:none;width:260px;display:flex;flex-direction:column;gap:12px;padding:4px 4px 4px 0}
.pv-side [data-close]{align-self:flex-end}
.pv-act{margin-top:8px}
.pv-act>*{width:100%}
.pv-nav{display:flex;gap:8px}
.pv-nav .btn{flex:1}

const norm = s => String(s ?? '').toLowerCase().replace(/\s+/g,'');
const fmt = ms => { const s = Math.max(0, Math.round(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };

function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){ const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ','){ row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c; }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  const clean = rows.filter(r => r.some(x => x.trim() !== '')); if (!clean.length) return [];
  const head = clean[0].map(h => h.trim().replace(/^﻿/,''));
  return clean.slice(1).map(r => Object.fromEntries(head.map((h,i) => [h, (r[i] ?? '').trim()])));
}
const csvCell = v => { const s = Array.isArray(v) ? v.join(';') : String(v ?? ''); return /[",\n;]/.test(s) && !Array.isArray(v) ? `"${s.replace(/"/g,'""')}"` : (/[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s); };
function hash(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const targetIdsFrom = s => (s||'').split(/[;|,]/).map(x => x.trim()).filter(Boolean).map(x => { const t = TARGETS.find(t => t.id === x || t.name === x || norm(t.name) === norm(x)); return t ? t.id : null; }).filter(Boolean);

async function shrink(file, edge){
  const bmp = await createImageBitmap(file).catch(() => null);
  if (!bmp) return null;
  const k = Math.min(1, edge / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(b => res(b), 'image/jpeg', edge === THUMB_EDGE ? .8 : .86));
}
function urlFor(p, kind){
  if (!S.urls[p.id]) S.urls[p.id] = {};
  if (!S.urls[p.id][kind]) S.urls[p.id][kind] = URL.createObjectURL(kind === 'thumb' ? (p.thumb || p.blob) : p.blob);
  return S.urls[p.id][kind];
}

// 사진마다 가로/세로 비율(ar = width / height)을 원본(blob)에서 한 번 재서 저장한다. 노출 CSV에 들어간다
async function ensureAspect(){
  if (typeof createImageBitmap === 'undefined') return;
  const need = S.photos.filter(p => !(p.ar > 0) && (p.blob || p.thumb));
  let n = 0;
  for (const p of need){
    const bmp = await createImageBitmap(p.blob || p.thumb).catch(() => null);
    if (!bmp || !bmp.height) continue;
    p.ar = Math.round(bmp.width / bmp.height * 10000) / 10000; if (bmp.close) bmp.close();
    await DB.putQuiet(p); n++;
  }
  if (n) poolPing();
}

function searchIndex(p){
  const out = new Set();
  p.tags.forEach(t => { out.add(t.toLowerCase()); (SYN[t] || []).forEach(s => out.add(s.toLowerCase())); });
  return [...out];
}
const isExcluded = () => false; // contains는 비율 조정용 표시일 뿐, 검색에서 빼지 않음
const usable = () => S.photos.filter(p => !isExcluded(p));
// 방·침대 자체를 가리키는 말은 점수에 넣지 않음 ("차분한 방"의 "방"이 자취방·다락방에 걸리지 않게)
const ROOM_WORDS = new Set(['방','방을','방이','침실','원룸','투룸','자취방','거실','집','인테리어','사진','room','rooms','bedroom','interior','photo','침대','bed','beds','벽','천장','공간','컬러','color','오피스텔']);
function tokenize(q){
  const neg = [], pos = [];
  const rest = q.toLowerCase().replace(/(\S+?)\s*(없는|없이|빼고|제외|말고)/g, (_, w) => { neg.push(w); return ' '; });
  rest.split(/[\s,]+/).filter(Boolean).forEach(t => {
    if (t.startsWith('-') && t.length > 1){ neg.push(t.slice(1)); return; }
    if (ROOM_WORDS.has(t)) return;
    const py = t.match(/^(\d+)평$/); // 평수: 10평 이하는 좁은 방으로 본다
    if (py){ if (+py[1] <= 10) pos.push('좁은'); return; }
    pos.push(t);
    const stem = t.replace(/(한|인|의|을|를|이|가|은|는|에|로|으로|같은|느낌|스타일|분위기|있는|처럼|톤|색|이랑|랑|만|하게|게|에서)$/,'');
    if (stem && stem !== t && !ROOM_WORDS.has(stem)) pos.push(stem);
  });
  return {pos:[...new Set(pos)], neg:[...new Set(neg)]};
}
function runSearch(q, seed){
  const {pos, neg} = tokenize(q);
  const scored = usable().map(p => {
    const idx = searchIndex(p);
    // 태그가 검색어를 품으면 1점, 검색어가 태그를 품기만 하면 0.5점 (턴테이블 → 테이블)
    // 한 글자 검색어는 태그·동의어와 똑같을 때만 (비 → 텔레비전, 큰 → 큰창문 같은 오탐 방지)
    const part = t => t.length >= 2 && idx.some(g => g.length >= 2 && t.includes(g));
    const match = t => t.length < 2 ? (idx.includes(t) ? 1 : 0) : idx.some(g => g.includes(t)) ? 1 : part(t) ? .5 : 0;
    if (neg.some(match)) return null;
    return {p, score: pos.reduce((a,t) => a + match(t), 0), tie: hash(seed + q + p.id)};
  }).filter(Boolean);
  const hits = scored.filter(x => x.score > 0).sort((a,b) => b.score - a.score || a.tie - b.tie);
  let list = hits, padded = false;
  if (hits.length < 12){ padded = true; list = hits.concat(scored.filter(x => x.score === 0).sort((a,b) => a.tie - b.tie).slice(0, 24 - hits.length)); }
  const targetTerms = TARGETS.filter(t => S.settings.targets.includes(t.id) && t.kw.some(k => norm(q).includes(norm(k)))).map(t => t.id);
  return {list: list.map(x => x.p), hits: hits.length, padded, pos, neg, targetTerms};
}

async function filesFromDrop(dt){
  const out = [];
  const walk = (entry) => new Promise(res => {
    if (entry.isFile) entry.file(f => { out.push(f); res(); }, () => res());
    else if (entry.isDirectory){ const r = entry.createReader(); const readAll = () => r.readEntries(async ents => { if (!ents.length) return res(); for (const en of ents) await walk(en); readAll(); }, () => res()); readAll(); }
    else res();
  });
  const items = Array.from(dt.items || []).map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (items.length){ for (const it of items) await walk(it); return out; }
  return Array.from(dt.files || []);
}
async function addFiles(fileList, meta){
  const files = Array.from(fileList || []);
  const csv = files.find(f => /\.csv$/i.test(f.name));
  const rows = meta || (csv ? parseCSV(await csv.text()) : []);
  const nfc = x => String(x || '').normalize('NFC');
  const byName = new Map(rows.map(r => [nfc((r.file || '').split('/').pop()), r]));
  const imgs = files.filter(f => /^image\//.test(f.type) || /\.(jpe?g|jfif|png|webp|gif|avif|heic)$/i.test(f.name));
  if (!imgs.length){ toast('추가할 사진이 없습니다'); return; }
  const existing = new Set(S.photos.map(p => p.name.normalize('NFC')));
  const prog = $('#prog'); if (prog) prog.hidden = false;
  let added = 0, skipped = 0, failed = 0;
  for (let i = 0; i < imgs.length; i++){
    const f = imgs[i];
    if (existing.has(nfc(f.name))){ skipped++; continue; }
    const [blob, thumb] = await Promise.all([shrink(f, MAX_EDGE), shrink(f, THUMB_EDGE)]);
    if (!blob){ failed++; continue; }
    const r = byName.get(nfc(f.name)) || byName.get(nfc(f.name).replace(/\.[^.]+$/, '.jpg')) || {};
    const rec = {id:uid(), name:nfc(f.name), tags:(r.tags||'').split(/[;|]/).map(t => t.trim()).filter(Boolean), contains:targetIdsFrom(r.contains), blob, thumb, addedAt:Date.now() + i};
    await DB.put(rec); S.photos.push(rec); existing.add(nfc(f.name)); added++;
    if (prog) prog.firstElementChild.style.width = ((i+1)/imgs.length*100) + '%';
  }
  ensureAspect();
  toast(`${added}장 추가${skipped ? ` · 같은 이름 ${skipped}장 건너뜀` : ''}${failed ? ` · 읽지 못한 파일 ${failed}장 (HEIC는 JPG로 바꿔 주세요)` : ''}`);
  renderPool();
}

/* ---------- 저장소의 기본 풀 (pool/pool.csv + pool/photos/) ---------- */
// GitHub Pages처럼 http(s)로 열면 시작할 때 기본 풀을 이 브라우저에 맞춰 넣는다. 파일로 열면(file://) 건너뜀
// 사진 id는 파일 이름에서 만들어 풀을 다시 맞춰도 참여자 기록의 사진 참조가 유지된다
const POOL_DIR = 'pool/';
const canSyncPool = () => /^https?:$/.test(location.protocol);
const poolId = name => 'pool_' + hash(name).toString(36);
// 두 창이 동시에 열려도 한 창만 내려받는다: 받는 창이 rs_pool_lock을 몇 초마다 갱신하고, 다른 창은 끝날 때까지 기다린다
const TAB_ID = uid(), POOL_LOCK = 'rs_pool_lock';
const otherLock = () => { const l = LS.get(POOL_LOCK, null); return l && l.by !== TAB_ID && Date.now() - l.t < 8000 ? l : null; };
const pause = ms => new Promise(r => setTimeout(r, ms));
function showPoolLoading(){
  const el = document.createElement('div'); el.className = 'pool-loading'; el.textContent = '사진을 불러오는 중…'; document.body.appendChild(el);
  return (n, total) => { if (n === null) el.remove(); else el.textContent = `사진을 불러오는 중… ${n} / ${total}`; };
}
async function syncDefaultPool(force){
  if (!canSyncPool()) return false;
  // 사진이 하나도 없으면 다 들어올 때까지 화면을 막는다 (빈 풀에서 참여자를 시작하지 않게)
  let step = S.photos.length ? null : showPoolLoading(), changed = false;
  const done = r => {
    S.syncing = false; if (step) step(null);
    const l = LS.get(POOL_LOCK, null); if (l && l.by === TAB_ID){ try{ localStorage.removeItem(POOL_LOCK); }catch(e){} }
    return r;
  };
  // 잠금을 걸고 잠깐 뒤 다시 읽어 내 것인지 확인한다 (두 창이 동시에 걸면 나중에 쓴 쪽만 남는다)
  const claim = async () => { LS.set(POOL_LOCK, {by: TAB_ID, t: Date.now(), n: 0, total: 0}); await pause(150); const l = LS.get(POOL_LOCK, null); return !!l && l.by === TAB_ID; };
  for (;;){
    if (otherLock()){
      step = step || showPoolLoading();
      for (let l; (l = otherLock()); ){ if (l.total) step(l.n, l.total); await pause(700); }
      await loadPhotos(); changed = true;
    }
    if (await claim()) break;
  }
  S.syncing = true; // 받는 동안 다른 창의 신호로 사진 목록을 다시 읽지 않는다
  const res = await fetch(POOL_DIR + 'pool.csv', {cache:'no-cache'}).catch(() => null);
  if (!res || !res.ok) return done(changed);
  const text = await res.text(), ver = String(hash(text));
  if (!force && LS.get('rs_pool_ver', '') === ver && S.photos.some(p => p.fromPool)) return done(changed);
  const rows = parseCSV(text).filter(r => r.file), total = rows.length, keep = new Set();
  let failed = 0, n = 0, next = 0;
  step = step || showPoolLoading();
  const lock = () => LS.set(POOL_LOCK, {by: TAB_ID, t: Date.now(), n, total});
  lock(); step(0, total);
  const one = async i => {
    const r = rows[i], name = r.file.normalize('NFC'), id = poolId(name);
    const tags = (r.tags || '').split(/[;|]/).map(t => t.trim()).filter(Boolean), contains = targetIdsFrom(r.contains);
    const old = S.photos.find(p => p.id === id);
    if (old){ Object.assign(old, {tags, contains, addedAt:i}); await DB.put(old); keep.add(id); }
    else {
      const blob = await fetch(POOL_DIR + 'photos/' + encodeURIComponent(name)).then(x => x.ok ? x.blob() : null).catch(() => null);
      const thumb = blob && await shrink(blob, THUMB_EDGE);
      if (thumb){ const rec = {id, name, tags, contains, blob, thumb, addedAt:i, fromPool:true}; await DB.put(rec); S.photos.push(rec); keep.add(id); }
      else failed++;
    }
    n++; step(n, total); lock();
  };
  // 6장씩 동시에 받는다
  await Promise.all(Array.from({length: 6}, async () => { while (next < total) await one(next++); }));
  // 기본 풀에서 빠진 사진은 지운다 (연구자가 직접 넣은 사진은 그대로)
  for (const p of S.photos.filter(p => p.fromPool && !keep.has(p.id))) await DB.del(p.id);
  S.photos = S.photos.filter(p => !p.fromPool || keep.has(p.id)).sort((a,b) => a.addedAt - b.addedAt);
  if (!failed) LS.set('rs_pool_ver', ver);
  if (failed) toast(`사진 ${failed}장을 불러오지 못했습니다. 새로고침하면 다시 시도합니다`);
  return done(true);
}

/* ---------- 참여자 검색 화면 ---------- */
const photoById = id => S.photos.find(p => p.id === id);
// 참여자 진행 상태: 담은 사진, 최종 사진, 지금 보는 화면, 마지막 검색어, 노출 기록 (새로고침해도 유지)
const PICK_KEY = 'rs_pick';
const pickDefault = () => ({liked: [], final: null, view: 'search', startedAt: null, finishedAt: null});
const P = Object.assign(pickDefault(), LS.get(PICK_KEY, {}));
let pickTimer = null;
const savePick = () => { clearTimeout(pickTimer); pickTimer = null; LS.set(PICK_KEY, P); };
const savePickSoon = () => { if (!pickTimer) pickTimer = setTimeout(savePick, 400); }; // 스크롤 중 자주 바뀌는 값(화면에 보인 시각)용
const reloadPick = () => { Object.keys(P).forEach(k => delete P[k]); Object.assign(P, pickDefault(), LS.get(PICK_KEY, {})); };
const isLiked = id => P.liked.includes(id);
const nowIso = () => new Date().toISOString();
const curQ = () => { const qs = P.queries || [], qn = qs.length; return {qn, q: qn ? qs[qn - 1].q : ''}; };

/* 노출 기록: 화면에 실제로 그린 사진을 검색마다 남긴다
   P.shows[]    = {n, qn, q, at, source, from, ids[], padded, hits, total, vis{id: 처음 반 이상 보인 때까지 ms}}
     source: search(검색) · more(결과 더 보기, 새로 붙은 사진만) · return(모아 보기에서 돌아옴) · reload(새로고침 뒤 복원) · rerender(그 밖에 다시 그림)
     from: 이 묶음 첫 사진의 순위(1부터). 순위 = from + ids 안 위치
   P.previews[] = {id, qn, q, openedAt, dwellMs, via(click|key|button), from(search|saved), rank} */
function logShow(source, list, from){
  if (P.final || !list.length) return null;
  const {qn, q} = curQ(), m = S.resultMeta || {};
  const via = qn ? ((P.queries || [])[qn - 1] || {}).via || null : null; // 이 결과를 낸 검색이 직접 입력(typed)인지 시작 단어(chip)인지 (2026-10-27.5부터)
  const e = {n: (P.shows || []).length + 1, qn, q, via, at: nowIso(), source, from, ids: list.map(p => p.id), padded: !!m.padded, hits: m.hits ?? null, total: S.results.length, vis: {}, sz: {}, vw: window.innerWidth, vh: window.innerHeight};
  (P.shows = P.shows || []).push(e); savePick(); return e;
}
// 그린 칸의 실제 크기(px, [너비, 높이])를 그 사진을 처음 그린 묶음에 적는다 (면적으로 가중한 노출 계산용)
function measureTiles(box){
  if (!box.isConnected) return; let ch = false;
  // 창 크기가 바뀌어 다시 배치되면 크기와 함께 vw·vh도 그때 창 크기로 맞춘다 (sz와 vw·vh가 같은 배치를 가리키게)
  $$('.g-item', box).forEach(t => { const e = (P.shows || [])[(S.owner[t.dataset.id] || 0) - 1]; if (!e || !e.sz) return; const r = t.getBoundingClientRect(), v = [Math.round(r.width), Math.round(r.height)], o = e.sz[t.dataset.id]; if (!o || o[0] !== v[0] || o[1] !== v[1]){ e.sz[t.dataset.id] = v; e.vw = window.innerWidth; e.vh = window.innerHeight; ch = true; } });
  if (ch) savePickSoon();
}
let IO = null;
function observeTiles(box){
  if (IO) IO.disconnect();
  if (!('IntersectionObserver' in window)) return;
  IO = new IntersectionObserver(ents => {
    ents.forEach(en => {
      if (!en.isIntersecting) return;
      const id = en.target.dataset.id, e = (P.shows || [])[(S.owner[id] || 0) - 1];
      if (e && e.vis && e.vis[id] == null){ e.vis[id] = Math.max(0, Date.now() - Date.parse(e.at)); savePickSoon(); }
      IO.unobserve(en.target);
    });
  }, {threshold: .5});
  $$('.g-item', box).forEach(t => IO.observe(t));
}
function pvOpen(id, via, from, rank){
  if (P.final) return;
  const {qn, q} = curQ();
  (P.previews = P.previews || []).push({id, qn, q, openedAt: nowIso(), dwellMs: null, via, from, rank});
  S.pvIdx = P.previews.length - 1; savePick();
}
function pvClose(){
  if (S.pvIdx == null) return;
  const e = (P.previews || [])[S.pvIdx]; S.pvIdx = null;
  if (e && e.dwellMs == null){ e.dwellMs = Math.max(0, Date.now() - Date.parse(e.openedAt)); savePick(); }
}
window.addEventListener('pagehide', () => { pvClose(); if (pickTimer) savePick(); });

// 검색 화면 아래 고정 줄: 담은 사진이 1장 이상이면 "한 장 고르러 가기". 장수 제한·시간 표시는 없다
function syncFinishBar(){
  const on = S.mode === 'search' && !P.final && P.view !== 'saved' && P.liked.length > 0 && !!$('#gform');
  let bar = $('#finish-bar');
  if (!on){ if (bar) bar.remove(); document.body.classList.remove('has-finish'); return; }

}
const goSaved = () => { P.view = 'saved'; P._sel = null; savePick(); renderSearchUI(); window.scrollTo(0,0); };
const savedBtn = () => `<button class="g-saved ${P.liked.length ? 'has' : ''}" id="to-saved" type="button" aria-label="담은 사진 보기">${heart(16)}<span class="lbl">담은 사진</span><b class="g-saved-count">${P.liked.length}</b></button>`;
const XICON = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
const MAG = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 0 1 5.2 10.4l4.4 4.4-1.4 1.4-4.4-4.4A6.5 6.5 0 1 1 10.5 4zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z" fill="currentColor"/></svg>';

const searchForm = (val) => `<form class="g-form" id="gform" role="search"><button class="g-go" type="submit" aria-label="검색">${MAG}</button><input type="search" id="q" aria-label="검색어" autocomplete="off" enterkeyhint="search"${val ? ` value="${esc(val)}"` : ''}></form>`;
function tile(p, mode, rank){
  return `<div class="g-item${mode==='pick' && P._sel===p.id ? ' sel' : ''}" data-id="${p.id}"${rank ? ` data-rank="${rank}"` : ''}>
    <button class="g-open" type="button" aria-label="${mode==='pick' ? '이 사진 고르기' : '크게 보기'}"><img loading="lazy" alt="방 사진" src="${urlFor(p,'thumb')}"></button>

      : `<button class="g-like${isLiked(p.id) ? ' on' : ''}" type="button" data-like="${p.id}" aria-pressed="${isLiked(p.id)}" aria-label="${likeText(p.id)}">${HEART}</button>`}
  </div>`;
}
/* 사진 칸 쌓기 (masonry): 열 수는 창 너비로 정하고(1440↑ 5, 1024↑ 4, 768↑ 3, 그 아래 2), 순위 순서대로 가장 짧은 열(같으면 왼쪽)에 놓는다.
   칸 높이 = 열 너비 / 사진 비율(ar). 사진을 받기 전에 자리가 정해지므로 받는 동안 칸이 움직이지 않는다. 같은 창 크기면 배치도 늘 같다.
   ar이 아직 없는 사진은 3:2로 잡아 두고, 사진이 로드되면 실제 비율로 다시 배치한다 */
const AR = {}; // 사진 파일에서 잰 비율 (p.ar이 아직 없을 때)
const arOf = id => { const p = photoById(id); return (p && p.ar > 0) ? p.ar : (AR[id] || 1.5); };
const masonryCols = () => { const w = window.innerWidth; return w >= 1440 ? 5 : w >= 1024 ? 4 : w >= 768 ? 3 : 2; };
function layoutMasonry(box){
  if (!box || !box.isConnected) return false;
  const tiles = $$('.g-item', box); if (!tiles.length){ box.style.height = ''; return false; }
  const n = masonryCols(), mob = window.innerWidth < 768, gap = box.classList.contains('g-pick') ? (mob ? 12 : 16) : (mob ? 6 : 8); // 모아 보기는 고른 사진 테두리가 들어가게 간격을 넓힌다
  for (let pass = 0; pass < 3; pass++){
    const W = box.clientWidth, cw = (W - gap * (n - 1)) / n, hs = new Array(n).fill(0);
    tiles.forEach(t => {
      let c = 0; for (let k = 1; k < n; k++) if (hs[k] < hs[c] - .5) c = k;
      const h = Math.round(cw / arOf(t.dataset.id));
      t.style.left = (c * (cw + gap)).toFixed(2) + 'px'; t.style.top = hs[c] + 'px'; t.style.width = cw.toFixed(2) + 'px'; t.style.height = h + 'px';
      hs[c] += h + gap;
    });
    box.style.height = Math.max(0, Math.max(...hs) - gap) + 'px';
    box.classList.add('laid');
    if (box.clientWidth === W) break; // 세로 스크롤 막대가 생겨 폭이 바뀌면 한 번 더
  }
  return true;
}
// 칸을 그린 뒤: 배치하고, ar이 없던 사진은 로드되면 다시 배치한다. 배치가 끝날 때마다 onLaid (결과 화면은 칸 크기 재기)
function masonry(box, onLaid){
  box._onLaid = onLaid || null;
  layoutMasonry(box); if (onLaid) onLaid();
  let t = null;
  $$('.g-item', box).forEach(tl => {
    const id = tl.dataset.id, p = photoById(id); if (p && p.ar > 0) return;
    const img = tl.querySelector('img'), fix = () => {
      if (!img.naturalWidth || !img.naturalHeight) return;
      const r = img.naturalWidth / img.naturalHeight; if (Math.abs(r - arOf(id)) < .01) return;
      AR[id] = r; clearTimeout(t); t = setTimeout(() => { if (layoutMasonry(box) && box._onLaid) box._onLaid(); }, 60);
    };
    img.complete ? fix() : img.addEventListener('load', fix);
  });
}
// 창 크기가 바뀌면 다시 배치하고 칸 크기를 다시 잰다 (잠깐 모아서 한 번)
let relayTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(relayTimer);
  relayTimer = setTimeout(() => {
    $$('.g-grid').forEach(box => { if (layoutMasonry(box) && box._onLaid) box._onLaid(); });
    const m = $('.modal .pv'); if (m && m._fit) m._fit();
  }, 120);
});
function bindLikeButtons(root){ $$('[data-like]', root).forEach(b => b.onclick = e => { e.stopPropagation(); toggleLike(b.dataset.like); if (P.view === 'saved') renderSearchUI(); }); }
// 검색 실행 (같은 검색어·시드면 늘 같은 결과라 새로고침 뒤에도 그대로 복원된다)
function doSearch(q){ const r = runSearch(q, 'pilot'); S.lastQuery = q; S.results = r.list; S.resultMeta = {hits: r.hits, padded: r.padded}; return r; }

// 검색 한 번: 검색창에 쳐서(typed) 또는 첫 화면 시작 단어를 눌러서(chip). 둘 다 똑같이 검색하고 queries[].via에 어디서 왔는지 남긴다
function submitQuery(q, via){
  if (!q) return;
  const r = doSearch(q); S.resultLimit = 30;
  if (!P.final){ (P.queries = P.queries || []).push({q, at: nowIso(), hits: r.hits, padded: r.padded, via}); if (!P.startedAt) P.startedAt = nowIso(); P.lastQ = q; P.resultLimit = 30; savePick(); }
  S.nextSource = 'search'; renderSearchUI(); window.scrollTo(0,0);
}
function renderSearchUI(){
  document.body.classList.add('search-mode');
  $('#brand').textContent = ''; $('#topright').innerHTML = '';
  if (IO){ IO.disconnect(); IO = null; }
  const finishRender = () => syncFinishBar();
  if (SEARCH_PAGE && (!P.pid || S.nextUp)){ renderStartUI(); return finishRender(); }
  if (P.final){ renderDoneUI(); return finishRender(); }
  if (P.view === 'saved'){ renderSavedUI(); return finishRender(); }
  const source = S.nextSource || 'rerender'; S.nextSource = null;
  if (!S.lastQuery){
    $('#main').innerHTML = `<div class="g-bar g-bar-home">${savedBtn()}</div><div class="g-home">
      <p class="g-task">${taskHTML()}</p>
      ${searchForm('')}
      <ul class="g-chips" aria-label="검색어 예">${STARTER_CHIPS.map(c => `<li><button class="g-chip" type="button" data-chip="${esc(c)}">${esc(c)}</button></li>`).join('')}</ul></div>`;
    $$('[data-chip]').forEach(b => b.onclick = () => submitQuery(b.dataset.chip, 'chip'));
  } else {
    $('#main').innerHTML = `<header class="g-top">
      ${searchForm(S.lastQuery)}${savedBtn()}
      <p class="g-task sm">${taskHTML()}</p></header>
      <div class="g-results" id="results"></div>
      <div class="g-more"><button class="btn lg" id="more" type="button" hidden>결과 더 보기</button></div>`;
    $('#more').onclick = () => { const before = Math.min(S.resultLimit, S.results.length); S.resultLimit += 30; P.resultLimit = S.resultLimit; savePick(); drawResults('more', before); };
    drawResults(source);
  }
  $('#to-saved').onclick = goSaved;
  $('#gform').onsubmit = e => { e.preventDefault(); submitQuery($('#q').value.trim(), 'typed'); };
  if (!S.lastQuery) $('#q').focus();
  finishRender();
}
function drawResults(source, before){
  const box = $('#results'); if (!box) return;
  const shown = S.results.slice(0, S.resultLimit);
  if (!shown.length){ box.innerHTML = '<p class="g-none">검색 결과가 없습니다.</p>'; $('#more').hidden = true; return; }
  // 맞는 사진이 적어 나머지로 채웠으면: 맞는 사진 묶음 → "다른 사진" 구분 줄 → 채운 사진 묶음 (masonry 두 개, 순위는 이어서 매김)
  // 맞는 사진이 하나도 없으면 구분 줄 대신 짧은 안내 한 줄 뒤에 채운 사진
  const m = S.resultMeta || {}, nHit = m.padded ? Math.min(m.hits || 0, shown.length) : shown.length;
  const block = (list, from) => `<div class="g-grid">${list.map((p, i) => tile(p, 'search', from + i)).join('')}</div>`;
  box.style.minHeight = box.offsetHeight + 'px'; // 다시 그리는 동안 높이를 붙잡아 둔다 (결과 더 보기에서 스크롤이 위로 튀지 않게)
  box.innerHTML = nHit === shown.length ? block(shown, 1)
    : nHit === 0 ? `<p class="g-note">맞는 사진이 없어 다른 사진을 보여 드려요</p>${block(shown, 1)}`
    : `${block(shown.slice(0, nHit), 1)}<div class="g-divider" role="separator">다른 사진</div>${block(shown.slice(nHit), nHit + 1)}`;
  // 노출 기록: 결과 더 보기면 새로 붙은 사진만, 그 밖에는 그린 사진 전부를 한 묶음으로
  if (source === 'more'){ const e = logShow('more', shown.slice(before), before + 1); if (e) e.ids.forEach(id => S.owner[id] = e.n); }
  else { const e = logShow(source, shown, 1); S.owner = {}; if (e) e.ids.forEach(id => S.owner[id] = e.n); }
  bindLikeButtons(box);
  $$('.g-item', box).forEach(t => t.querySelector('.g-open').onclick = () => openPreview(t.dataset.id, shown, false, 'click'));
  $('#more').hidden = S.results.length <= S.resultLimit;
  // 칸 배치(사진 비율로 높이를 미리 정함) → 바로 칸 크기 재기. 다시 배치될 때(창 크기·비율 보정)마다 다시 잰다 (두 묶음 모두)
  $$('.g-grid', box).forEach(g => masonry(g, () => measureTiles(box)));
  box.style.minHeight = '';
  observeTiles(box);
}

function renderSavedUI(){
  const list = P.liked.map(photoById).filter(Boolean);
  if (P._sel && !P.liked.includes(P._sel)) P._sel = null;
  $('#main').innerHTML = `<header class="g-head">
      <button class="btn" id="back" type="button">← 검색으로 돌아가기</button>
      <h1 class="g-title">담은 사진 <b>${list.length}</b></h1></header>
    ${list.length ? `<p class="muted g-guide">담은 사진 중에서 다음에 혼자 지낼 방으로 가장 마음에 드는 사진을 한 장 골라 주세요. 필요 없는 사진은 ×를 눌러 뺄 수 있어요.</p>
      <div class="g-grid g-pick" id="saved">${list.map(p => tile(p, 'pick')).join('')}</div>
      <div class="g-decide"><span class="muted" id="sel-hint">${P._sel ? '고른 사진: 1장' : '사진을 눌러 한 장을 고르세요'}</span><button class="g-btn" id="decide" type="button" ${P._sel ? '' : 'disabled'}>이 사진으로 결정</button></div>`
    : `<div class="empty">아직 담은 사진이 없어요.<br>검색 결과에서 하트를 눌러 사진을 담아 두세요.</div>`}`;
  $('#back').onclick = () => { P.view = 'search'; savePick(); S.nextSource = 'return'; renderSearchUI(); };

  $$('[data-remove]', box).forEach(b => b.onclick = e => { e.stopPropagation(); removeSaved(b.dataset.remove); });
  $$('.g-item', box).forEach(t => {
    t.querySelector('.g-open').onclick = () => { P._sel = t.dataset.id; savePick(); $$('.g-item', box).forEach(x => x.classList.toggle('sel', x === t)); $('#decide').disabled = false; $('#sel-hint').textContent = '고른 사진: 1장'; };
  });
  $$('[data-zoom]', box).forEach(b => b.onclick = e => { e.stopPropagation(); openPreview(b.dataset.zoom, list, true, 'click'); });
  $('#decide').onclick = confirmFinal;
}
// 모아 보기에서 ×로 빼기: 바로 빼고 5초 동안 "되돌리기"를 보여 준다. 되돌리면 같은 자리로 돌아온다
// likeLog: 빼기 = {action:'빼기', where:'모아 보기'}, 되돌리기 = {action:'담기', where:'되돌리기'} (likedRef는 되돌리기를 건너뛰어 처음 담은 검색을 그대로 쓴다)
function removeSaved(id){
  if (P.final) return;
  const i = P.liked.indexOf(id); if (i < 0) return;
  const {qn, q} = curQ(), wasSel = P._sel === id;
  (P.likeLog = P.likeLog || []).push({action: '빼기', id, at: nowIso(), qn, q, where: '모아 보기'});
  P.liked.splice(i, 1); if (wasSel) P._sel = null;
  savePick(); renderSearchUI();
  undoToast('사진을 뺐어요', '되돌리기', () => {
    if (P.final || P.liked.includes(id)) return;
    const c = curQ();
    P.likeLog.push({action: '담기', id, at: nowIso(), qn: c.qn, q: c.q, where: '되돌리기'});
    P.liked.splice(Math.min(i, P.liked.length), 0, id); if (wasSel && !P._sel) P._sel = id;
    savePick(); if (P.view === 'saved') renderSearchUI(); else syncLikes();
  });
}
let undoEl = null;
function undoToast(msg, label, onUndo, ms = 5000){
  if (undoEl) undoEl.remove();
  const t = document.createElement('div'); t.className = 'toast undo'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)} ·</span><button type="button">${esc(label)}</button>`;
  document.body.appendChild(t); undoEl = t;
  const timer = setTimeout(() => { t.remove(); if (undoEl === t) undoEl = null; }, ms);
  $('button', t).onclick = () => { clearTimeout(timer); t.remove(); undoEl = null; onUndo(); };
}
function confirmFinal(){
  const p = photoById(P._sel); if (!p) return;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="panel g-confirm g-cf" role="dialog" aria-modal="true" aria-label="최종 선택 확인">
    <div class="row between"><div class="stack" style="gap:4px"><h2>이 사진으로 결정할까요?</h2><p class="muted">결정하면 다시 바꿀 수 없어요.</p></div>
    <div class="row"><button class="btn lg" data-close type="button">다시 고르기</button><button class="g-btn" id="ok" type="button" style="min-height:48px">결정</button></div></div>
    <img alt="고른 사진" src="${urlFor(p,'full')}"></div>`;
  m.onclick = e => { if (e.target === m || e.target.closest('[data-close]')) m.remove(); };
  $('#ok', m).onclick = () => { P.final = p.id; P.finishedAt = nowIso(); archiveCurrent('완료'); savePick(); m.remove(); renderSearchUI(); window.scrollTo(0,0); };
  document.body.appendChild(m);
  // 사진 크기를 비율로 정해 카드가 사진 폭에 맞게 줄어들게 (세로 사진 옆 빈 공간 없음)
  const panel = $('.g-cf', m), img = $('img', panel), head = panel.firstElementChild, cs = getComputedStyle(panel), padX = parseFloat(cs.paddingLeft) * 2, padY = parseFloat(cs.paddingTop) * 2, mp = parseFloat(getComputedStyle(m).paddingTop) * 2;
  const ar = arOf(p.id), aw = Math.min(window.innerWidth - mp - padX, 1000);
  for (let k = 0; k < 2; k++){ // 카드 폭이 바뀌면 제목 줄 높이도 바뀌므로 한 번 더
    const ah = window.innerHeight - mp - padY - head.offsetHeight - 14;
    let w = aw, h = w / ar; if (h > ah){ h = ah; w = h * ar; }
    img.style.width = Math.floor(w) + 'px'; img.style.height = Math.floor(h) + 'px';
  }
}

// 다음 참여자로: 연구자 창의 "다음 참여자 받기"(rs_next_up 신호) 또는 완료 화면에서 Ctrl+Shift+N(연구자 창이 없을 때). 참여자 화면에는 버튼이 없다

  $('#main').innerHTML = `<div class="g-home"><form class="panel g-confirm" id="start-form" aria-label="참여자 시작" aria-busy="${!S.poolReady}">

// 크게 보기: 넓은 화면은 사진 왼쪽 + 오른쪽 버튼 열, 좁은 화면은 버튼 줄이 사진 위. 사진은 원본 전체가 화면 안에 들어오게 (sizePreview)
// 열린 시간(dwellMs)과 화살표·버튼 이동을 기록한다
function sizePreview(panel, ar){
  const img = $('.pv-img', panel), side = $('.pv-side', panel); if (!img || !side) return;
  const vw = window.innerWidth, vh = window.innerHeight, mob = vw < 768;
  const pad = mob ? 8 : 24, inner = mob ? 10 : 16, gap = mob ? 10 : 24;
  const aw = vw - 2 * pad - 2 * inner - (mob ? 0 : side.offsetWidth + gap);
  const ah = vh - 2 * pad - 2 * inner - (mob ? side.offsetHeight + gap : 0);
  let w = Math.min(aw, mob ? aw : 1100), h = w / ar; if (h > ah){ h = ah; w = h * ar; }
  img.style.width = Math.max(1, Math.floor(w)) + 'px'; img.style.height = Math.max(1, Math.floor(h)) + 'px';
}
function openPreview(id, list, fromSaved, via){
  const p = photoById(id); if (!p) return;
  const i = list.findIndex(x => x.id === id);
  pvOpen(id, via || 'click', fromSaved ? 'saved' : 'search', i + 1);
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="panel pv" role="dialog" aria-modal="true" aria-label="이미지 크게 보기">
    <div class="pv-side">
      <button class="btn" data-close type="button">닫기</button>
      <div class="pv-act">${fromSaved ? `<button class="g-btn" id="pick-this" type="button" style="min-height:48px">이 사진 고르기</button>` : `<button class="g-like-btn${isLiked(id) ? ' on' : ''}" type="button" data-like="${id}" aria-pressed="${isLiked(id)}">${heart(20)}<span data-like-label="${id}">${likeText(id)}</span></button>`}</div>
      <div class="pv-nav"><button class="btn" type="button" data-nav="-1" ${i <= 0 ? 'disabled' : ''}>← 이전</button><button class="btn" type="button" data-nav="1" ${i >= list.length - 1 ? 'disabled' : ''}>다음 →</button></div>
    </div>
    <img class="pv-img" alt="방 사진" src="${urlFor(p,'full')}"></div>`;
  const close = () => { pvClose(); m.remove(); document.removeEventListener('keydown', onKey); };
  const go = (d, how) => { const n = list[i + d]; if (n){ close(); openPreview(n.id, list, fromSaved, how); } };
  const onKey = e => { if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') go(1, 'key'); if (e.key === 'ArrowLeft') go(-1, 'key'); };
  m.onclick = e => { if (e.target === m || e.target.closest('[data-close]')) close(); };
  $$('[data-nav]', m).forEach(b => b.onclick = () => go(Number(b.dataset.nav), 'button'));
  $$('[data-like]', m).forEach(b => b.onclick = () => toggleLike(id));
  const pk = $('#pick-this', m); if (pk) pk.onclick = () => { P._sel = id; savePick(); close(); renderSearchUI(); };
  document.addEventListener('keydown', onKey);
  document.body.appendChild(m);
  // 사진 크기를 비율로 먼저 정해 두고(받는 동안 움직이지 않게), 실제로 그린 크기를 기록에 남긴다. 창 크기가 바뀌면 다시 맞춘다
  const panel = $('.pv', m), img = $('.pv-img', m), idx = S.pvIdx;
  const size = () => { const e = (P.previews || [])[idx]; if (!e || !img.isConnected) return; const r = img.getBoundingClientRect(); Object.assign(e, {w: Math.round(r.width), h: Math.round(r.height), vw: window.innerWidth, vh: window.innerHeight}); savePickSoon(); };
  panel._fit = () => { sizePreview(panel, arOf(id)); size(); };
  panel._fit();
  if (!(p.ar > 0)) img.addEventListener('load', () => { if (img.naturalWidth){ AR[id] = img.naturalWidth / img.naturalHeight; panel._fit(); } });
}

// 기록에 나온 모든 사진(노출·크게 보기·담기·최종)의 {name, contains[], ar}
function photoMetaFor(r){
  const ids = new Set([...(r.shows || []).flatMap(e => e.ids), ...(r.previews || []).map(e => e.id), ...(r.liked || []).map(x => x.id), ...(r.final ? [r.final.id] : [])]);
  const out = {};
  ids.forEach(id => { const p = photoById(id); out[id] = p ? {name: p.name, contains: (p.contains || []).slice(), ar: p.ar || null} : {name: id, contains: null, ar: null}; });
  return out;

// 기록 한 건의 노출 요약 (이전 버전 기록은 shows가 없어 null)
function impStats(r){
  if (!Array.isArray(r.shows)) return null;
  const pv = r.previews || [], seen = new Set([...r.shows.flatMap(e => e.ids), ...pv.map(e => e.id)]);
  const inView = r.shows.reduce((a, e) => a + Object.keys(e.vis || {}).length, 0);
  const uniqView = new Set(r.shows.flatMap(e => Object.keys(e.vis || {})));
  const padded = new Set(r.shows.filter(e => e.padded && e.qn).map(e => e.qn)).size;
  return {total: r.shows.reduce((a, e) => a + e.ids.length, 0), unique: seen.size, inView, uniqView: uniqView.size, previews: pv.length,
    dwell: pv.reduce((a, e) => a + (e.dwellMs || 0), 0), padded, events: r.shows.length};
}
const fmtTime = iso => { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('ko-KR', {month:'numeric', day:'numeric'}) + ' ' + d.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'}); };

// 노출 한 건 = 한 줄 (검색 결과에 그린 사진 한 장, 또는 크게 보기 한 번). 이전 버전 기록은 줄이 없다
const IMP_TARGETS = ['plant','rug','lamp','art','bedding'];
const IMP_HEAD = ['researcher','participant_id','record_no','status','app_version','pool_ver','event_no','query_no','query','source','context','shown_at','photo_id','photo','rank','is_match','padded','hits','in_viewport','first_visible_at','tile_w','tile_h','viewport_w','viewport_h','preview_via','dwell_ms','contains',...IMP_TARGETS.map(t => 'has_' + t),'aspect_ratio','liked_at_end','is_final','query_via'];
// 기록 한 건의 노출 줄 (값 배열, IMP_HEAD 순서). impressions.csv와 시트의 "검색 노출" 탭이 같이 쓴다
function impressionRows(r){
  if (!Array.isArray(r.shows)) return [];
  const out = [];
  const meta = r.photoMeta || {}, liked = new Set((r.liked || []).map(x => x.id)), fin = r.final ? r.final.id : null;
  const ph = id => { const m = meta[id], p = photoById(id); return {name: (m && m.name) || (p && p.name) || id, contains: (m && m.contains) || (p && p.contains) || [], ar: (m && m.ar) || (p && p.ar) || ''}; };
  const tail = id => { const x = ph(id); return [x.contains.map(c => (TARGETS.find(t => t.id === c) || {name: c}).name).join(';'), ...IMP_TARGETS.map(t => x.contains.includes(t) ? 1 : 0), x.ar, liked.has(id) ? 1 : 0, id === fin ? 1 : 0]; };
  const base = [r.researcher || '', r.label, r.no, r.status, r.appVersion || '', r.poolVer || ''];
  // 맨 끝 열 query_via (2026-10-27.5부터): 그 검색이 직접 입력(typed)인지 시작 단어(chip)인지. 예전 기록은 빈칸
  const via = (qn, v) => v || (qn ? ((r.queries || [])[qn - 1] || {}).via : '') || '';
  r.shows.forEach(e => e.ids.forEach((id, k) => {
    const rank = e.from + k, v = e.vis ? e.vis[id] : null, sz = (e.sz || {})[id] || [];
    out.push([...base, e.n, e.qn, e.q, e.source, 'search', e.at, id, ph(id).name, rank, e.hits != null ? (rank <= e.hits ? 1 : 0) : '', e.padded ? 1 : 0, e.hits ?? '',
      v != null ? 1 : 0, v != null ? new Date(Date.parse(e.at) + v).toISOString() : '', sz[0] ?? '', sz[1] ?? '', e.vw ?? '', e.vh ?? '', '', '', ...tail(id), via(e.qn, e.via)]);
  }));
  (r.previews || []).forEach(e => out.push([...base, '', e.qn, e.q, 'preview', e.from, e.openedAt, e.id, ph(e.id).name, e.rank, '', '', '', '', '', e.w ?? '', e.h ?? '', e.vw ?? '', e.vh ?? '', e.via, e.dwellMs ?? '', ...tail(e.id), via(e.qn)]));
  return out;
}
function impressionsCSV(recs = ARCH){
  const cell = v => { const x = String(v ?? ''); return /[",\n]/.test(x) ? `"${x.replace(/"/g,'""')}"` : x; };
  return [IMP_HEAD.join(','), ...recs.flatMap(r => impressionRows(r).map(x => x.map(cell).join(',')))].join('\n');
}
async function exportArchiveZip(){
  if (typeof JSZip === 'undefined'){ toast('ZIP을 만들려면 인터넷 연결이 필요합니다. CSV로 받아 주세요'); return; }
  toast('ZIP을 만드는 중…');
  const zip = new JSZip();
  // 화면에 보이는 기록만 담는다 (진행자 필터를 걸면 그 사람 것만)
  const recs = archShown();
  zip.file('participants.csv', '﻿' + archiveCSV(recs));
  zip.file('participants.json', JSON.stringify(recs, null, 1));
  zip.file('impressions.csv', '﻿' + impressionsCSV(recs));
  for (const r of recs){
    const dir = `${r.researcher ? r.researcher.replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 20) + '_' : ''}${String(r.no).padStart(2,'0')}${r.label ? '_' + r.label.replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 30) : ''}/`;
    for (const ref of r.liked){ const p = photoById(ref.id); if (p) zip.file(dir + (r.final && ref.id === r.final.id ? 'FINAL_' : 'liked_') + ref.name.replace(/\.[^.]+$/, '') + '.jpg', p.blob); }
  }
  const tag = S.archWho != null ? (S.archWho || '이름없음').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 20) + '_' + new Date().toISOString().slice(0,10)
    : archWhoList().length > 1 ? '전체_' + new Date().toISOString().slice(0,10) : fileTag();
  download(`search_participants_${tag}.zip`, await zip.generateAsync({type:'blob'}), 'application/zip');
}
// 각자 내보낸 ZIP(또는 participants.json)을 올리면 기록을 합친다. 같은 기록(id·진행자가 같음)은 건너뜀
// 사진은 기록에 사진 id만 있으므로, 같은 기본 풀을 쓰는 한 이 브라우저의 풀에서 그대로 보인다
async function importArchive(fileList){
  const files = Array.from(fileList || []); if (!files.length) return;
  reloadArch();
  const key = r => r.id + '|' + (r.researcher || '');
  const have = new Set(ARCH.map(key));
  let added = 0, dup = 0, bad = 0;
  for (const f of files){
    let recs = null;
    try{
      if (/\.json$/i.test(f.name)) recs = JSON.parse(await f.text());
      else {
        if (typeof JSZip === 'undefined'){ toast('ZIP을 열려면 인터넷 연결이 필요합니다'); return; }
        const zip = await JSZip.loadAsync(f);
        const j = Object.values(zip.files).find(x => /participants\.json$/i.test(x.name));
        recs = j ? JSON.parse(await j.async('string')) : null;
      }
    }catch(e){ recs = null; }
    if (!Array.isArray(recs)){ bad++; continue; }
    for (const r of recs){
      if (!r || !r.id || !Array.isArray(r.liked)) continue;
      if (have.has(key(r))){ dup++; continue; }
      ARCH.push(Object.assign({}, r, {imported: true})); have.add(key(r)); added++;
    }
  }
  saveArch(); render();
  toast(`기록 ${added}건 추가${dup ? ` · 이미 있는 ${dup}건 건너뜀` : ''}${bad ? ` · 읽지 못한 파일 ${bad}개 (기록 ZIP이 맞는지 확인해 주세요)` : ''}`);
}

/* ---------- 구글 시트로 한 벌 더 보내기 (2026-10-27.4, 선택) ---------- */
// 연구자 화면 "시트 연결"에 Apps Script 웹 앱 주소·토큰을 넣으면, 기록이 생길 때(완료·미완료) 시트에도 보낸다.
// 주소가 없으면 아무것도 하지 않는다 (예전처럼 이 브라우저 + ZIP만). 주소·토큰은 이 브라우저(rs_sheet)에만 두고 코드에는 넣지 않는다.
// 줄은 여기서 만든다 (impressions.csv와 같은 impressionRows·impStats를 써서 시트와 CSV가 같게). 시트 쪽은 열 이름으로 칸을 찾는다.
// 누가 보내나: 기록을 만든 창이 바로 한 번 보내고, 검색 전용 창(?view=search)이 아닌 창이 대기·실패 기록을 다시 보낸다(sheetPump).
// 겹쳐 보내지 않게: 보내기 전에 기록에 {state:'sending', by: 이 창(TAB_ID), until}을 적고 잠깐 뒤 다시 읽어 내 표시가 남아 있을 때만 보낸다.
// 시트도 같은 record_id 줄을 지우고 다시 쓰므로, 혹시 두 번 가도 줄은 한 벌만 남는다.
// 참여자 화면에는 아무것도 보이지 않고, 실패해도 참여자 진행에는 영향이 없다.
const SHEET_KEY = 'rs_sheet';
const sheetCfg = () => { const c = LS.get(SHEET_KEY, {}) || {}; return {url: String(c.url || '').trim(), token: String(c.token || '').trim()}; };
const SHEET_BACKOFF = [15, 30, 60, 120, 300]; // 실패 뒤 다시 보내기까지 기다리는 초 (마지막 값이 최대)
const SHEET_CLAIM_MS = 45000, SHEET_TIMEOUT_MS = 30000;
const sheetInFlight = new Set();
const SHEET_ERR = {network: '연결 안 됨', timeout: '응답 없음', bad_token: '토큰이 맞지 않음', token_not_set: '시트에 토큰이 없음', no_tab: '시트에 탭이 없음', no_record_id_column: '시트 머리글 확인',
  bad_reply: '응답이 이상함 (배포 설정 확인)', busy: '시트가 바쁨', bad_json: '보낸 내용 오류', server_error: '시트 오류', no_url: '주소 없음'};
const sheetErrText = j => (SHEET_ERR[j.error] || (/^http_/.test(j.error || '') ? `HTTP ${j.error.slice(5)}` : (j.error || '알 수 없음'))) + (j.detail ? ` (${String(j.detail).slice(0, 60)})` : '');
// 기록 한 건 → 시트 세 탭의 줄. {탭: {columns, values}} (record_id, received_at은 시트가 채운다)
function sheetRows(r){
  const st = impStats(r), fin = r.final, liked = r.liked || [];
  const fm = fin ? ((r.photoMeta || {})[fin.id] || null) : null, fp = fin ? photoById(fin.id) : null;
  const finC = fin ? ((fm && fm.contains) || (fp && fp.contains) || []) : null;
  const mins = r.startedAt && r.finishedAt ? Math.round((Date.parse(r.finishedAt) - Date.parse(r.startedAt)) / 6000) / 10 : '';
  const g = {researcher: r.researcher || '', participant_id: r.label || '', status: r.status || '', session_at: r.sessionAt || '', started_at: r.startedAt || '', finished_at: r.finishedAt || '',
    minutes: Number.isFinite(mins) ? mins : '', query_count: (r.queries || []).length, queries: (r.queries || []).map(x => x.q).join(' | '),
    liked_count: liked.length, unliked_count: (r.likeLog || []).filter(e => e.action === '빼기').length, liked_files: liked.map(x => x.name).join('|'),
    final_file: fin ? fin.name : '', final_query: finalQueryOf(r)};
  IMP_TARGETS.forEach(t => { g['final_has_' + t] = finC ? (finC.includes(t) ? 1 : 0) : ''; });
  Object.assign(g, st ? {impressions_total: st.total, impressions_in_viewport: st.inView, unique_photos_seen: st.unique, unique_photos_in_viewport: st.uniqView, previews_count: st.previews, padded_queries: st.padded}
    : {impressions_total: '', impressions_in_viewport: '', unique_photos_seen: '', unique_photos_in_viewport: '', previews_count: '', padded_queries: ''});
  Object.assign(g, {app_version: r.appVersion || '', pool_ver: r.poolVer || ''});
  const likes = (r.likeLog || []).map((e, i) => [r.researcher || '', r.label || '', i + 1, e.action || '', e.name || refOf(e.id).name, e.qn ?? '', e.q ?? '', e.where || '', e.at || '']);
  return {
    '기록': {columns: Object.keys(g), values: [Object.values(g)]},
    '노출': {columns: IMP_HEAD, values: impressionRows(r)},
    '담기': {columns: ['researcher','participant_id','event_no','action','photo','query_no','query','where','at'], values: likes}
  };
}
// 본문은 글자(text/plain)로, 머리글을 따로 붙이지 않는다 → 브라우저가 사전 확인(preflight) 없이 보낸다. Apps Script의 302 이동은 fetch가 따라간다
async function sheetFetch(url, init = {}){
  const ac = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ac ? setTimeout(() => ac.abort(), SHEET_TIMEOUT_MS) : null;
  try{
    const res = await fetch(url, Object.assign({redirect: 'follow', cache: 'no-store', credentials: 'omit'}, init, ac ? {signal: ac.signal} : {}));
    const txt = await res.text(); let j = null; try{ j = JSON.parse(txt); }catch(e){}
    if (!j || typeof j !== 'object') return {ok: false, error: res.ok ? 'bad_reply' : 'http_' + res.status};
    return j;
  }catch(e){ return {ok: false, error: e && e.name === 'AbortError' ? 'timeout' : 'network'}; }
  finally{ if (timer) clearTimeout(timer); }
}
const sheetPost = (cfg, body) => sheetFetch(cfg.url, {method: 'POST', body: JSON.stringify(Object.assign({token: cfg.token}, body))});
function setSheet(id, val){ reloadArch(); const r = ARCH.find(x => x.id === id); if (!r) return; r.sheet = val; saveArch(); sheetUI(); }
// 이 창이 기록 탭을 보여 주고 있으면 다시 그린다
function sheetUI(){ if (S.mode !== 'search' && (S.rtab || 'pool') === 'archive' && $('#body')) rerenderResearcher(); }
async function sendRecord(id){
  const cfg = sheetCfg();
  if (!cfg.url || sheetInFlight.has(id)) return null;
  reloadArch(); let r = ARCH.find(x => x.id === id); if (!r) return null;
  const s = r.sheet || {}, tries = s.tries || 0;
  if (s.state === 'sending' && s.by !== TAB_ID && (s.until || 0) > Date.now()) return null; // 다른 창이 보내는 중
  sheetInFlight.add(id);
  try{
    setSheet(id, {state: 'sending', by: TAB_ID, until: Date.now() + SHEET_CLAIM_MS, tries, at: s.at || null});
    await pause(200); // 같은 기록을 다른 창도 집었으면 나중에 적은 쪽만 남는다 (사진 풀 잠금과 같은 방식)
    reloadArch(); r = ARCH.find(x => x.id === id);
    if (!r || !r.sheet || r.sheet.by !== TAB_ID || r.sheet.state !== 'sending') return null; // 다른 창이 가져감
    const reply = await sheetPost(cfg, {action: 'record', record_id: r.id, app_version: APP_VERSION, rows: sheetRows(r)});
    reloadArch(); const cur = ARCH.find(x => x.id === id);
    if (!cur || !cur.sheet || cur.sheet.by !== TAB_ID || cur.sheet.state !== 'sending') return reply; // 보내는 사이 고쳐짐 → 대기로 남아 다시 보낸다
    if (reply.ok) setSheet(id, {state: 'sent', at: nowIso(), rows: reply.rows || null});
    else { const n = tries + 1; setSheet(id, {state: 'failed', at: nowIso(), error: sheetErrText(reply), code: reply.error || '', tries: n, next: Date.now() + SHEET_BACKOFF[Math.min(n, SHEET_BACKOFF.length) - 1] * 1000}); }
    return reply;
  }catch(e){
    try{ setSheet(id, {state: 'failed', at: nowIso(), error: '보내기 오류', code: 'client', tries: tries + 1, next: Date.now() + SHEET_BACKOFF[0] * 1000}); }catch(_){}
    return {ok: false, error: 'client'};
  }finally{ sheetInFlight.delete(id); }
}
// 기록을 만든 직후 한 번 보낸다 (실패해도 조용히 남겨 두고 연구자 화면이 다시 보낸다)
function sheetKick(id){ try{ if (sheetCfg().url) setTimeout(() => { sendRecord(id).catch(() => {}); }, 50); }catch(e){} }
const sheetDue = (r, now) => { const s = r.sheet; if (!s || r.imported || s.state === 'sent') return false; if (s.state === 'sending') return (s.until || 0) <= now; return (s.next || 0) <= now; };
let sheetPumping = false;
async function sheetPump(){
  if (sheetPumping || !sheetCfg().url) return;
  sheetPumping = true;
  try{
    reloadArch(); const now = Date.now();
    for (const id of ARCH.filter(r => sheetDue(r, now)).map(r => r.id)) await sendRecord(id);
  }catch(e){}
  finally{ sheetPumping = false; }
}
// 손으로 다시 보내기: 기다림 없이 바로
async function sheetSendNow(ids){
  let ok = 0, bad = 0;
  for (const id of ids){ const j = await sendRecord(id); if (j && j.ok) ok++; else if (j) bad++; }
  return {ok, bad};
}
// 연결 확인: 주소(GET)와 토큰(POST ping)을 차례로 본다
async function sheetCheck(){
  const cfg = sheetCfg();
  if (!/^https?:\/\//i.test(cfg.url)) return {ok: false, msg: '웹 앱 주소를 넣어 주세요 (https://script.google.com/macros/s/…/exec)'};
  const g = await sheetFetch(cfg.url);
  if (!g.ok || g.app !== 'search-to-sheet') return {ok: false, msg: '주소 확인 실패 · ' + (g.ok ? '다른 웹 앱의 주소입니다' : sheetErrText(g))};
  if (!cfg.token) return {ok: false, msg: '주소는 맞습니다 · 토큰을 넣어 주세요'};
  const p = await sheetPost(cfg, {action: 'ping'});
  return p.ok ? {ok: true, msg: '연결됨 · 토큰 맞음'} : {ok: false, msg: '주소는 맞습니다 · ' + sheetErrText(p)};
}
function sheetBadge(r){
  const s = r.sheet, on = !!sheetCfg().url;
  if (!s) return on ? '<span class="pill" title="시트에 보내지 않은 기록">시트 안 보냄</span>' : '';
  const t = s.at ? ` title="${esc(fmtTime(s.at))}"` : '';
  if (s.state === 'sent') return `<span class="pill ok"${t}>시트 저장됨</span>`;
  if (s.state === 'failed') return `<span class="pill bad"${t}>시트 실패 · ${esc(s.error || '')}</span>`;
  if (s.state === 'sending' && (s.until || 0) > Date.now()) return '<span class="pill">시트 보내는 중</span>';
  return '<span class="pill warn">시트 대기</span>';
}

function bindSheetBox(){
  const box = $('#sheet-box'); if (!box) return;
  box.ontoggle = () => { S.sheetOpen = box.open; };
  const save = () => { LS.set(SHEET_KEY, {url: $('#sheet-url').value.trim(), token: $('#sheet-token').value.trim()}); };
  $('#sheet-url').oninput = save; $('#sheet-token').oninput = save;
  // 주소·토큰을 바꾸면 실패한 기록을 바로 다시 보낼 수 있게 기다림을 없앤다
  const changed = () => { save(); reloadArch(); let k = 0; ARCH.forEach(r => { if (r.sheet && r.sheet.state === 'failed'){ r.sheet.next = 0; k++; } }); if (k) saveArch(); S.sheetMsg = ''; sheetPump(); }; // 여기서 다시 그리지 않는다 (옆 칸으로 옮겨 가는 중에 입력이 끊기지 않게)
  $('#sheet-url').onchange = changed; $('#sheet-token').onchange = changed;
  $('#sheet-check').onclick = async () => { save(); const m = $('#sheet-msg'); m.textContent = '확인 중…'; const r = await sheetCheck(); S.sheetMsg = r.msg; const mm = $('#sheet-msg'); if (mm){ mm.textContent = r.msg; mm.style.color = r.ok ? '' : 'var(--danger)'; } };
  const all = $('#sheet-all'); if (all) all.onclick = async () => {
    all.disabled = true; all.textContent = '보내는 중…';
    reloadArch(); const ids = archShown().filter(r => !r.imported && (!r.sheet || r.sheet.state !== 'sent')).map(r => r.id);
    const res = await sheetSendNow(ids); toast(`시트로 보냄 ${res.ok}건${res.bad ? ` · 실패 ${res.bad}건` : ''}`); rerenderResearcher();
  };
}

/* ---------- 연구자 패널 (검색 화면에서 나가기) ---------- */
function renderRx(){
  const p = $('#rx-panel'); if (p.hidden) return;
  p.innerHTML = `<div class="research-strip">연구자 패널</div>
    ${S.mode === 'search' ? '<button class="btn sm" id="rx-back">사진 풀 관리로 돌아가기</button>' : '<p class="small muted">검색 화면에서 이 패널로 관리 화면에 돌아옵니다.</p>'}`;
  const b = $('#rx-back'); if (b) b.onclick = () => { S.mode = null; p.hidden = true; render(); };
}
const toggleRx = () => { const p = $('#rx-panel'); p.hidden = !p.hidden; renderRx(); };
$('#rx-toggle').onclick = toggleRx;
$('#rx-toggle').hidden = !!VIEW; // 화면을 나눠 열면 연구자 패널을 쓰지 않는다 (검색 화면에서 연구자 화면으로 가는 길 없음)
document.addEventListener('keydown', e => { if (!VIEW && e.ctrlKey && e.shiftKey && (e.key === 'R' || e.key === 'r')){ e.preventDefault(); toggleRx(); } });

/* ---------- 다른 창의 변경 받기 (연구자 창 ↔ 검색 창) ---------- */
let poolTimer = null;
// 연구자 화면을 새로 그린다. 기록의 참여자 ID나 태그를 고치는 중이면 건너뛰고, 진행자 칸에 있던 커서는 되돌린다
function rerenderResearcher(){
  const a = document.activeElement;
  if (a && a.matches('.arch-label, #editor input, #sheet-box input')) return;
  const refocus = a && a.id === 'who';
  render();
  const w = refocus && $('#who'); if (w){ w.focus(); w.setSelectionRange(w.value.length, w.value.length); }
}
window.addEventListener('storage', e => {
  if (e.key === ARCH_KEY){
    reloadArch();
    if (S.mode !== 'search') rerenderResearcher();
  }
  if (e.key === PICK_KEY){
    reloadPick();
    if (RESEARCH_PAGE && S.mode !== 'search') renderTopRight(); // 진행 중 표시만 갱신 (노출 기록이 자주 바뀌어도 화면 전체를 다시 그리지 않게)
    else if (SEARCH_PAGE && !P.pid){ S.nextUp = false; S.lastQuery = ''; render(); } // 연구자 창에서 "미완료로 끝내기" (또는 검색 창 없이 "다음 참여자 받기")
  }
  // 연구자 창의 "다음 참여자 받기": 결정을 마친 같은 참여자일 때만 시작 화면으로
  if (e.key === NEXT_KEY && SEARCH_PAGE && e.newValue){
    reloadPick(); const n = LS.get(NEXT_KEY, {}) || {};
    if (P.final && n.pid === P.pid && n.final === P.final) nextParticipant();
  }
  if (e.key === 'rs_pool_ping' && !S.syncing){
    clearTimeout(poolTimer);
    poolTimer = setTimeout(async () => { if (S.syncing) return; await loadPhotos(); if (S.mode !== 'search' && (S.rtab || 'pool') === 'pool' && !document.querySelector('.pool-loading')) render(); }, 800);
  }
});

/* ---------- 시작 ---------- */
// 새로고침 뒤에는 마지막 검색 결과를 그대로 다시 보여 준다 (검색어·시드가 같으면 결과도 같다). 노출 기록에는 source=reload로 남는다
function restoreResults(){ if (P.lastQ && !P.final && !S.lastQuery){ doSearch(P.lastQ); S.resultLimit = P.resultLimit || 30; S.nextSource = 'reload'; } }
(async () => {
  await loadPhotos(); if (P.active) S.mode = 'search';
  if (S.photos.length) restoreResults();
  render();
  const changed = await syncDefaultPool();
  S.poolReady = true; // 시작 화면 입력을 연다
  if (changed){ restoreResults(); render(); } else if ($('#start-form')) renderStartUI();
  ensureAspect();
  // 검색 전용 창이 아닌 창이 시트로 못 간 기록을 다시 보낸다 (시작 직후 한 번, 그 뒤 5초마다 기다림이 끝난 기록만)
  if (!SEARCH_PAGE){ setTimeout(sheetPump, 1500); setInterval(sheetPump, 5000); }
})();
</script>
